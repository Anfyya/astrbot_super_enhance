name: AI Commit Police & Auto Merge

on:
  # 使用 pull_request_target 保证永远执行 main 分支上的质检脚本，AI 在 PR 里改脚本也无效
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  strict-commit-check:
    name: strict-commit-check
    runs-on: ubuntu-latest
    steps:
      - name: 严格审计所有 Commit 与文件变更
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'EOF'
          import json, os, re, sys, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]

          def gh_get_all(path):
              items = []
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  url = f"https://api.github.com/repos/{repo}/{path}{sep}per_page=100&page={page}"
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json"
                  })
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                  if not data:
                      break
                  items.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return items

          errors = []

          # 1. 铁律一：禁止通过 PR 修改 .github/ 目录（防止 AI 偷偷删掉或篡改质检规则）
          files = gh_get_all(f"pulls/{pr_num}/files")
          for f in files:
              if f["filename"].startswith(".github/"):
                  errors.append(f"❌ 禁止通过 PR 修改工作流/规则文件: {f['filename']}")

          # 2. 铁律二：逐条严查每个 Commit 的信息
          commits = gh_get_all(f"pulls/{pr_num}/commits")
          required_fields = [
              ("模型名字", r"(?im)^(?:模型|Model)\s*[:：]\s*(.+)$"),
              ("删改/新增原因", r"(?im)^(?:原因|删改原因|新增原因|Reason)\s*[:：]\s*(.+)$"),
              ("影响范围", r"(?im)^(?:影响|Impact)\s*[:：]\s*(.+)$"),
              ("AI提问原话", r"(?im)^(?:AI提问|问话|AI-Question)\s*[:：]\s*(.+)$"),
              ("本人是否同意及原话", r"(?im)^(?:本人同意|用户同意|User-Approval)\s*[:：]\s*(.+)$"),
          ]

          # 拦截敷衍废话
          banned_values = {
              "无", "略", "无影响", "同上", "正常", "同意", "是", "已同意",
              "n/a", "none", "null", "todo", "tbd", "-", "yes", "ok"
          }

          for c in commits:
              sha = c["sha"][:7]
              msg = c["commit"]["message"]
              for label, pattern in required_fields:
                  m = re.search(pattern, msg)
                  if not m:
                      errors.append(f"❌ Commit [{sha}] 缺少必填字段【{label}】")
                  else:
                      val = m.group(1).strip()
                      if len(val) < 5 or val.lower() in banned_values:
                          errors.append(f"❌ Commit [{sha}] 的【{label}】内容过短或过于敷衍: '{val}'（必须写清楚具体内容/原话）")

          if errors:
              print("========== 质检不通过，已强制打回 ==========")
              print("\n".join(errors))
              print("\n请严格按照以下 Commit 格式重写后再提交：")
              print("""
          <简短标题>

          模型: <具体模型名，如 Claude-3.7-Sonnet / GPT-5>
          原因: <具体新增/修改/删除了什么，为什么这么改>
          影响: <影响哪些文件、接口、逻辑或性能>
          AI提问: <AI向用户确认时的完整问话>
          本人同意: <是/否 - 附上用户本人的原话>
          """)
              sys.exit(1)

          print(f"✅ 质检通过！共审计 {len(commits)} 条 commit，全部合规。")
          EOF

  auto-merge:
    name: Auto Merge to Main
    needs: strict-commit-check
    runs-on: ubuntu-latest
    steps:
      - name: 自动合并到 main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 如果只要求这一个 CI 检查，直接合并；如果仓库还有别的单测在跑，则开启自动合并等它们跑完
          gh pr merge "$PR_NUMBER" --merge --delete-branch --repo "${{ github.repository }}" \
          || gh pr merge "$PR_NUMBER" --auto --merge --delete-branch --repo "${{ github.repository }}"
