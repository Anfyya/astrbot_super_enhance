<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>上下文</title>
<style>
  /* ============ 色板 ============ */
  :root{
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --bg:#ffffff; --side:#f7f7f5; --sunk:#f2f2ef; --hover:rgba(30,30,20,.045); --press:rgba(30,30,20,.08);
    --line:#ebebe7; --line2:#dcdcd6;
    --t1:#1d1d1b; --t2:#62625d; --t3:#9d9d97;
    --accent:#4c5bd4; --on-accent:#ffffff; --accent-soft:#eef0fb; --ring:rgba(76,91,212,.3);
    --bubble:#f3f3f0; --bubble-me:#e9edfc;
    --danger:#d23c3c; --danger-soft:#fbebeb;
    --ok:#2e9a68;
    --c1:#4c5bd4; --c2:#d6a046; --c3:#b7b7b0; --c4:#2e9a68;
    --hl:#fde68a; --hl-t:#1d1d1b;
    --pop:0 12px 32px rgba(20,20,30,.13),0 1px 3px rgba(20,20,30,.06);
    --scrim:rgba(20,20,25,.26);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#1a1a1d; --side:#151517; --sunk:#232327; --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
    --line:#29292e; --line2:#37373d;
    --t1:#ececee; --t2:#a4a4ac; --t3:#6f6f78;
    --accent:#8d98ff; --on-accent:#11132b; --accent-soft:#252a48; --ring:rgba(141,152,255,.38);
    --bubble:#252529; --bubble-me:#2a3051;
    --danger:#f0736e; --danger-soft:#3b2325;
    --ok:#4fc28c;
    --c1:#8d98ff; --c2:#e0a548; --c3:#55555e; --c4:#4fc28c;
    --hl:#6b5413; --hl-t:#fff6d6;
    --pop:0 16px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --bg:#1a1a1d; --side:#151517; --sunk:#232327; --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.09);
      --line:#29292e; --line2:#37373d;
      --t1:#ececee; --t2:#a4a4ac; --t3:#6f6f78;
      --accent:#8d98ff; --on-accent:#11132b; --accent-soft:#252a48; --ring:rgba(141,152,255,.38);
      --bubble:#252529; --bubble-me:#2a3051;
      --danger:#f0736e; --danger-soft:#3b2325;
      --ok:#4fc28c;
      --c1:#8d98ff; --c2:#e0a548; --c3:#55555e; --c4:#4fc28c;
      --hl:#6b5413; --hl-t:#fff6d6;
      --pop:0 16px 40px rgba(0,0,0,.55);
      --scrim:rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  /* 头像色：按平台 id 散列，克制的低饱和色 */
  .h0{--hb:#e2f3ec;--hf:#237a57}.h1{--hb:#e8eafb;--hf:#4552b5}.h2{--hb:#f7ecdd;--hf:#9a5a17}
  .h3{--hb:#f6e5ee;--hf:#a33d74}.h4{--hb:#e1eff6;--hf:#276c8c}.h5{--hb:#ecebe8;--hf:#57574f}
  .hm{--hb:var(--accent-soft);--hf:var(--accent)}
  :root[data-theme="dark"] .h0{--hb:#183a2d;--hf:#7fd4ae}:root[data-theme="dark"] .h1{--hb:#262c55;--hf:#a9b1ff}
  :root[data-theme="dark"] .h2{--hb:#3f2e17;--hf:#e9b46b}:root[data-theme="dark"] .h3{--hb:#3f2131;--hf:#f0a0c8}
  :root[data-theme="dark"] .h4{--hb:#173444;--hf:#86c8e6}:root[data-theme="dark"] .h5{--hb:#2c2c30;--hf:#b5b5bd}

  /* ============ 基础 ============ */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  [hidden]{display:none !important}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ring);outline-offset:1px}
  svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  mark{background:var(--hl);color:var(--hl-t);border-radius:3px;padding:0 1px}
  .grow{flex:1}
  .muted{color:var(--t3)}
  .scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}

  .btn{
    height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);
    font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
    transition:background .12s,border-color .12s,color .12s,opacity .12s;
  }
  .btn:hover{background:var(--hover)}
  .btn:active{background:var(--press)}
  .btn:disabled{opacity:.4;cursor:default;background:var(--bg)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.pri:disabled{background:var(--accent);filter:none}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--t2)}
  .btn.quiet:hover{background:var(--hover);color:var(--t1)}
  .btn.danger{color:var(--danger)}
  .btn.danger.armed,.btn.danger.armed:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.ibtn{width:32px;padding:0}
  .btn.sm{height:28px;padding:0 10px;font-size:12.5px}
  .inp{height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--bg);font-size:13px;outline:none;min-width:0}
  .inp:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  .ta{width:100%;display:block;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--bg);
    font:14px/1.7 var(--font);outline:none;resize:vertical;min-height:44px}
  .ta.mono{font:12.5px/1.6 var(--mono)}
  .chip-t{height:28px;border-radius:999px;padding:0 12px;border:1px solid var(--line2);background:transparent;color:var(--t2);font-size:12.5px;white-space:nowrap}
  .chip-t:hover{background:var(--hover);color:var(--t1)}
  .chip-t.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border-radius:10px}
  .seg button{border:0;background:transparent;height:28px;padding:0 14px;border-radius:7px;color:var(--t2);font-size:13px;white-space:nowrap}
  .seg button:hover{color:var(--t1)}
  .seg button.on{background:var(--bg);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--sunk);color:var(--t2);white-space:nowrap}
  .tag svg.i{width:12px;height:12px}
  .tag.acc{background:var(--accent-soft);color:var(--accent)}
  .av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:13px;font-weight:600;background:var(--hb);color:var(--hf);user-select:none}
  .av.lg{width:36px;height:36px;font-size:15px}
  .av svg.i{width:16px;height:16px}

  /* ============ 骨架 ============ */
  .app{display:flex;height:100vh;height:100dvh;overflow:hidden}
  .side{width:236px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);min-height:0}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .view{flex:1;display:flex;flex-direction:column;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  .scroller{flex:1;min-height:0;position:relative}

  /* 侧栏 */
  .side-head{height:56px;flex:none;display:flex;align-items:baseline;gap:8px;padding:18px 18px 0}
  .brand{font-weight:650;font-size:15px;letter-spacing:.01em}
  .brand-sub{font-size:12px;color:var(--t3)}
  .side-scroll{flex:1;min-height:0;padding:4px 8px 16px}
  .side-label{font-size:11.5px;color:var(--t3);padding:14px 10px 6px;letter-spacing:.06em}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left}
  .nav-item:hover{background:var(--hover)}
  .nav-item.on{background:var(--bg);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
  .nav-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .nav-n{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-s{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-r{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
  .side-empty{font-size:12.5px;color:var(--t3);padding:6px 10px}

  /* 主区头部 */
  .mhead{min-height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who-t{min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .who-n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who-s{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-acts{display:flex;gap:2px}
  .narrow-only{display:none !important}
  .gauge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default}
  .gauge .bar{width:92px;height:6px;border-radius:3px;background:var(--sunk);position:relative}
  .gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
  .gauge .fill.hot{background:var(--danger)}
  .gauge .tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--t3)}
  .gauge b{color:var(--t1);font-weight:600}

  .pbar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .search{position:relative;display:flex;align-items:center;flex:0 1 260px;min-width:160px}
  .search > svg.i{position:absolute;left:10px;color:var(--t3);pointer-events:none}
  .search .inp{width:100%;padding:0 30px 0 32px}
  .search .clr{position:absolute;right:4px;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--t3);display:grid;place-items:center}
  .search .clr:hover{background:var(--hover);color:var(--t1)}
  .search .clr svg.i{width:14px;height:14px}
  .hint{font-size:12px;color:var(--t3);white-space:nowrap}

  /* ============ 聊天流 ============ */
  .stream{max-width:800px;margin:0 auto;padding:12px 28px 120px}
  .day{display:flex;align-items:center;gap:12px;margin:22px 0 10px;color:var(--t3);font-size:12px}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
  .loadmore{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 4px}
  .row{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
  .row.cont{margin-top:0}
  .row.me{justify-content:flex-end}
  .row.cont .av{visibility:hidden;height:0}
  .col{min-width:0;max-width:min(600px,84%);display:flex;flex-direction:column;align-items:flex-start}
  .row.me .col{align-items:flex-end}
  .row.tl .col{max-width:100%;flex:1;padding-left:40px}
  .name{font-size:12px;color:var(--t2);margin:0 0 4px 2px;font-weight:500}
  .bub{background:var(--bubble);border-radius:16px;border-top-left-radius:6px;padding:9px 14px;font-size:14.5px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;position:relative;transition:box-shadow .12s}
  .row.me .bub{background:var(--bubble-me);border-top-left-radius:16px;border-top-right-radius:6px}
  .row.cont .bub{border-top-left-radius:16px}
  .row.me.cont .bub{border-top-right-radius:16px}
  .bub.empty{color:var(--t3);font-size:13px}
  .clickable .bub,.clickable .tres{cursor:pointer}
  .clickable .bub:hover,.clickable .tres:hover{box-shadow:0 0 0 1px var(--line2)}
  .row.focus .bub,.row.focus .tres,.row.sel .bub,.row.sel .tres{box-shadow:0 0 0 2px var(--accent) !important}
  .selmark{display:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:6px;align-items:center;justify-content:center;color:var(--on-accent);cursor:pointer}
  .multi .selmark{display:inline-flex}
  .row.sel .selmark{background:var(--accent);border-color:var(--accent)}
  .selmark svg.i{width:12px;height:12px;stroke-width:2.6}
  .row:not(.sel) .selmark svg.i{display:none}
  .row.me .selmark{margin-right:auto}
  .row.flash .bub,.row.flash .tres{animation:flash 1.6s ease}
  @keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--ring)}100%{box-shadow:0 0 0 0 transparent}}
  .clamp{max-height:calc(1.75em * 10 + 18px);overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
  .linkbtn{border:0;background:transparent;padding:2px 2px;color:var(--accent);font-size:12.5px}
  .linkbtn:hover{text-decoration:underline}
  .meta{position:relative;z-index:2;font-size:11.5px;color:var(--t3);margin:4px 6px 0;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .meta .x{opacity:0;transition:opacity .12s}
  .row.me .meta{flex-direction:row-reverse}
  .row:hover .meta .x,.row.focus .meta .x{opacity:1}
  .think-t{border:0;background:transparent;color:var(--t3);font-size:12px;padding:1px 2px;margin:0 0 4px;display:inline-flex;align-items:center;gap:3px}
  .think-t:hover{color:var(--t1)}
  .think-t svg.i{width:13px;height:13px;transition:transform .15s}
  .think-t.open svg.i{transform:rotate(90deg)}
  .think{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:0 0 8px 2px;color:var(--t2);font-size:13px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;align-self:stretch}
  .calls{display:flex;flex-direction:column;gap:6px;margin-top:6px;align-self:stretch}
  details.call{border:1px solid var(--line);border-radius:10px;font-size:12.5px;background:var(--bg)}
  details.call>summary{list-style:none;padding:6px 10px;display:flex;align-items:center;gap:6px;color:var(--t2);cursor:pointer}
  details.call>summary::-webkit-details-marker{display:none}
  details.call>summary b{color:var(--t1);font-weight:550;font-family:var(--mono);font-size:12px}
  .code{margin:0;padding:10px 12px;font:12px/1.65 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--t2);max-height:320px;overflow:auto}
  details.call .code{border-top:1px solid var(--line)}
  .tres{width:100%;border:1px dashed var(--line2);border-radius:12px;padding:8px 12px;background:transparent}
  .tres-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
  .tres-h svg.i{width:13px;height:13px}
  .tres-h b{font-family:var(--mono);font-weight:550;color:var(--t2);font-size:12px}
  .tres .code{padding:4px 0 0;max-height:calc(1.65em * 4 + 4px);overflow:hidden}
  .gap{height:10px;position:relative}
  .gap::before{content:"";position:absolute;left:44px;right:8px;top:50%;height:1px;background:var(--accent);opacity:0;transition:opacity .12s}
  .gap-btn{position:absolute;left:0;right:0;top:-6px;margin:0 auto;width:max-content;height:22px;padding:0 10px 0 7px;border-radius:999px;
    border:1px solid var(--accent);background:var(--bg);color:var(--accent);font-size:12px;display:inline-flex;align-items:center;gap:3px;opacity:0;transition:opacity .12s;z-index:1}
  .gap-btn svg.i{width:13px;height:13px}
  .gap:hover::before,.gap:hover .gap-btn,.gap-btn:focus-visible{opacity:1}
  .multi .gap,.filtering .gap{pointer-events:none}
  .multi .gap::before,.multi .gap-btn,.filtering .gap::before,.filtering .gap-btn{display:none}
  .sk{background:var(--sunk);border-radius:16px;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:90px 20px;color:var(--t3);text-align:center;font-size:13px}
  .empty-state .big{font-size:15px;color:var(--t2);font-weight:550}

  .selbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:6;
    background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px 6px 6px 16px;font-size:13px;white-space:nowrap}
  .selbar b{font-variant-numeric:tabular-nums}

  /* ============ 详情面板 ============ */
  .insp{width:380px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg);min-height:0}
  .ph{min-height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line)}
  .ph-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .ph-n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph-s{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb{flex:1;min-height:0;padding:18px 20px 24px}
  .pf{flex:none;display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
  .fld{margin-bottom:18px}
  .fld-l{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);margin-bottom:6px}
  .fld-n{font-size:12px;color:var(--t3);margin-top:6px;line-height:1.55}
  .ro{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:10px;padding:10px 12px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .addlink{border:1px dashed var(--line2);background:transparent;border-radius:10px;width:100%;height:36px;color:var(--t2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
  .addlink:hover{color:var(--t1);border-color:var(--t3)}
  .addlink svg.i{width:14px;height:14px}

  /* ============ 请求快照 ============ */
  .req{max-width:880px;margin:0 auto;padding:22px 28px 90px}
  .req-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .req-time{font-size:20px;font-weight:650;letter-spacing:-.01em}
  .req-sub{font-size:12.5px;color:var(--t3)}
  .comp{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:16px 0 10px;background:var(--sunk)}
  .comp i{display:block;height:100%;min-width:3px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--t2)}
  .legend button{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:6px;color:inherit}
  .legend button:hover b{text-decoration:underline}
  .legend .dot{width:8px;height:8px;border-radius:2px}
  .legend b{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
  .tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto;scrollbar-width:none}
  .tabs2::-webkit-scrollbar{display:none}
  .tabs2 button{border:0;background:transparent;padding:8px 12px;font-size:13.5px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs2 button:hover{color:var(--t1)}
  .tabs2 button.on{color:var(--t1);border-bottom-color:var(--t1);font-weight:550}
  .tabs2 .n{color:var(--t3);font-size:12px;margin-left:5px;font-weight:400}
  .tabhead{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;flex-wrap:wrap}
  .doc{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .doc .hd{font-weight:650;font-size:14.5px;margin:18px 0 6px}
  .doc .hd:first-child{margin-top:0}
  .doc .para{margin:0 0 10px}
  .doc .para:last-child{margin-bottom:0}
  .doc b{font-weight:650}
  .doc.raw{font:12.5px/1.7 var(--mono);color:var(--t2)}
  details.card{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--bg)}
  details.card>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary .ct{flex:1;min-width:0;display:flex;flex-direction:column}
  details.card>summary .cn{font-weight:600;font-size:13.5px}
  details.card>summary .cp{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details.card>summary .chev{color:var(--t3);transition:transform .15s;display:inline-flex}
  details.card[open]>summary .chev{transform:rotate(90deg)}
  details.card[open]>summary .cp{display:none}
  details.card>.cb{padding:0 16px 16px}
  .trow{display:flex;align-items:baseline;gap:10px}
  .trow b{font-family:var(--mono);font-size:12.5px;font-weight:550}
  .quote{border-left:3px solid var(--accent);padding:2px 0 2px 16px;font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .params{display:flex;flex-direction:column;gap:14px;margin-top:14px;padding:14px;border-radius:10px;background:var(--sunk)}
  .params .inp,.params .ta{background:var(--bg)}
  .params .ta{min-height:34px;padding:6px 10px;font-size:13.5px}
  .param .fld-l{margin-bottom:5px}
  .pkey{font-family:var(--mono);font-weight:550;color:var(--t1);font-size:12px}
  .reqmark{font-size:11px;color:var(--danger)}
  .objlist{display:flex;flex-direction:column;gap:10px}
  .objitem{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 12px 12px;display:flex;flex-direction:column;gap:10px}
  .objhead{display:flex;align-items:center;font-size:12px;color:var(--t3);margin-right:-6px}
  .objfield .fld-l{margin-bottom:4px}
  .newpill{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;height:32px;padding:0 14px;border-radius:999px;border:0;
    background:var(--accent);color:var(--on-accent);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--pop)}
  .newpill svg.i{width:14px;height:14px;transform:rotate(90deg)}

  /* ============ 共享场景 ============ */
  .scene{max-width:1080px;margin:0 auto;padding:22px 28px 90px}
  .notice{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--t2);margin-bottom:16px;display:flex;gap:8px;align-items:center}
  .people{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
  .pc{border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
  .pc.editing{box-shadow:0 0 0 2px var(--ring);border-color:var(--accent)}
  .pc-h{display:flex;align-items:center;gap:10px}
  .pc-n{font-weight:650;font-size:15px}
  .pc-s{font-size:12px;color:var(--t3)}
  .slot-l{font-size:11.5px;color:var(--t3);letter-spacing:.06em;margin-bottom:4px}
  .place{font-size:17px;font-weight:650;line-height:1.4;word-break:break-word}
  .place.unk{color:var(--t3);font-weight:500;font-size:15px}
  .doing{font-size:14px;color:var(--t2);margin-top:2px;word-break:break-word}
  .when{font-size:12px;color:var(--t3);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .when svg.i{width:13px;height:13px}
  .lsec{max-width:720px;margin:0 auto 26px}
  .lsec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 2px 10px}
  .lsec-t{font-size:13px;font-weight:650;color:var(--t2);letter-spacing:.04em;flex:none}
  .lsec-s{font-size:12px;color:var(--t3)}
  .lrows{display:flex;flex-direction:column}
  .lrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .lrow:first-child{border-top:0;padding-top:2px}
  .lrow .lt{flex:1;min-width:0;font-size:14px;line-height:1.55;word-break:break-word}
  .lrow .lm{font-size:12px;color:var(--t3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lrow .la{display:flex;gap:4px;flex:none;align-items:center}
  .lrow.off .lt{color:var(--t3)}
  .lrow.off .lt .what{text-decoration:line-through;text-decoration-color:var(--line2)}
  .ladd{display:flex;gap:8px;margin-top:4px}
  .ladd .inp{flex:1}
  .ptop{max-width:720px;margin:0 auto 18px;display:flex;flex-direction:column;gap:10px}
  .ptop .notice{margin-bottom:0;align-items:flex-start;line-height:1.6}
  .ptop-r{display:flex;gap:8px;align-items:center}
  .ptop-r .inp{flex:1}
  .tag.cold{background:var(--accent-soft);color:var(--accent)}
  .when-b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--t1);margin-right:6px}
  @media (max-width:640px){
    .lrow{flex-wrap:wrap}
    .lrow .la{width:100%;justify-content:flex-end}
  }
  .prev{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--t2);line-height:1.6}
  .prev .pl{color:var(--t1);font-weight:550}
  .sched{font-size:12.5px;color:var(--t3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc-f{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:-2px}
  .form{display:flex;flex-direction:column;gap:12px}
  .form .row2{display:flex;gap:8px}
  .form .row2 .inp{flex:1}
  .form label{font-size:12px;color:var(--t2);display:block;margin-bottom:5px}
  .form .inp{width:100%}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .sub-sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2);cursor:pointer;user-select:none;position:relative}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch .tr{width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s}
  .switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .tr{background:var(--accent)}
  .switch input:checked + .tr::after{transform:translateX(12px)}
  .switch input:focus-visible + .tr{outline:2px solid var(--ring);outline-offset:1px}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;font-size:13.5px;margin-bottom:18px}
  .kv .k{color:var(--t3);font-size:12.5px;padding-top:1px}
  .kv .v{white-space:pre-wrap;word-break:break-word}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t3);flex:none}
  .dot.on{background:var(--ok)}
  .dot.bad{background:var(--danger)}
  /* ============ 每日日程 ============ */
  .schbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto 14px}
  .schdate{display:flex;gap:6px;align-items:center;flex:0 1 auto;min-width:0}
  .schdate select.inp{width:220px;min-width:0;flex:0 1 220px}
  .schcard{max-width:760px;margin:0 auto}
  .schline{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:3px}
  .schacts{display:flex;flex-wrap:wrap;gap:4px;margin:-4px 0 -2px -10px}
  .schmeta{border-radius:12px;padding:12px 14px;margin:0 -14px;cursor:pointer;outline:none;transition:background .12s}
  .schmeta:hover,.schmeta:focus-visible{background:var(--hover)}
  .schmeta.focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .tllist{display:flex;flex-direction:column;gap:2px;margin:0 -10px}
  .tlrow{display:flex;gap:12px;padding:10px;border-radius:10px;align-items:flex-start;cursor:pointer;outline:none;transition:background .12s}
  .tlrow:hover,.tlrow:focus-visible{background:var(--hover)}
  .tlrow.ro{cursor:default}
  .tlrow.ro:hover{background:transparent}
  .tlrow .tm{flex:none;width:96px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--t2);padding-top:1px}
  .tlrow .tx{flex:1;min-width:0;font-size:14px;line-height:1.6;word-break:break-word}
  .tlrow .of{font-size:12px;color:var(--t3);margin-top:3px}
  .tlrow.now{background:var(--accent-soft)}
  .tlrow.now .tm{color:var(--accent)}
  .tlrow.past .tx,.tlrow.past .tm{color:var(--t3)}
  .tlrow.focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
  .addlink.on{border-color:var(--accent);color:var(--accent)}
  .joblog{font-size:12.5px;line-height:1.7;color:var(--t2);white-space:pre-wrap;margin-top:6px}
  @media (max-width:640px){
    .schdate{flex:1 1 100%}
    .schdate select.inp{flex:1 1 auto;width:auto}
    .tlrow{flex-direction:column;gap:2px}
    .tlrow .tm{width:auto}
    .kv{grid-template-columns:max-content minmax(0,1fr)}
  }

  /* ============ 浮层 ============ */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:55}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);z-index:70;background:var(--bg);box-shadow:var(--pop);display:flex;flex-direction:column;animation:slidein .18s ease}
  @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
  .modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--scrim)}
  .dlg{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);width:100%;max-width:420px;padding:20px 22px 18px}
  .dlg h3{margin:0 0 8px;font-size:15px;font-weight:650}
  .dlg p{margin:0;color:var(--t2);font-size:13.5px;line-height:1.7;white-space:pre-wrap}
  .dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);
    background:var(--t1);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:13px;box-shadow:var(--pop)}
  .toast.err{background:var(--danger);color:#fff}
  .toast .act{border:0;background:transparent;color:inherit;font-weight:650;padding:0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

  /* 世界线：按人看。窄屏一列（规矩、打算在上，时间线，作息在最后）；宽屏时间线在左，规矩、打算、作息在右 */
  .wtop{max-width:1080px;margin:0 auto 14px}
  .wtop .lsec{max-width:none;margin-bottom:0}
  .wnote{width:100%;text-align:left;cursor:pointer;margin-bottom:0}
  .wbar{max-width:1080px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .wcount{display:inline-block;min-width:16px;height:16px;line-height:16px;margin-left:6px;padding:0 4px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:11px;text-align:center}
  .wgrid{max-width:720px;margin:0 auto;display:flex;flex-direction:column}
  .wgrid .lsec{max-width:none;margin:0 0 22px}
  #worldStatusBtn.on{background:var(--accent-soft);color:var(--accent)}
  .wprog{display:flex;align-items:center;gap:8px;margin-top:6px}
  .wprog-track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
  .wprog-bar{height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear}
  .wprog-t{font-size:12px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .wstep-ed{display:flex;flex-direction:column;gap:6px}
  .wstep-row{display:flex;align-items:center;gap:6px}
  .wstep-row .inp{flex:1;min-width:0}
  .wstep-row .inp.wstep-m{flex:0 0 64px;text-align:right}
  .wstep-n,.wstep-u{flex:none;font-size:12.5px;color:var(--t3);font-variant-numeric:tabular-nums}
  .wstep-n{min-width:18px;text-align:right}
  .wsteps{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--t3)}
  .wsteps li{margin:1px 0}
  .wsteps li.done{text-decoration:line-through;opacity:.7}
  .wsteps li.now{color:var(--t1);font-weight:600}
  .lrow.wfuture .lt{color:var(--t2)}
  /* 世界线的编辑框：就地展开成一块有边框的面板，一眼看得出在改哪一条；保存 / 取消贴在视口底部，不用往下翻 */
  .wform{display:flex;flex-direction:column;gap:12px;margin:8px -12px;padding:12px 14px 0;border-radius:12px;background:var(--sunk);
    box-shadow:0 0 0 1.5px var(--accent),0 6px 18px rgba(20,20,40,.08);animation:wfin .16s ease-out}
  .lrows > .wform:first-child,.pc > .wform:first-child{margin-top:0}
  @keyframes wfin{from{opacity:0}to{opacity:1}}
  .wform-h{display:flex;align-items:baseline;gap:2px 10px;flex-wrap:wrap;font-size:13px;line-height:1.5}
  .wform-h .t{color:var(--accent);font-weight:650;flex:none}
  .wform-h .w{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums;min-width:0;word-break:break-word}
  .wform-h .m{color:var(--t3);font-size:12px}
  .wform .inp{width:100%;background:var(--bg)}
  .wform .ta{background:var(--bg);font-size:13.5px;line-height:1.65;padding:7px 10px;min-height:36px}
  .wfld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .wfld-l{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;font-size:12.5px;color:var(--t2);font-weight:550;line-height:1.45}
  .wfld-l .n{font-size:11.5px;color:var(--t3);font-weight:400}
  .wcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
  .wcols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wcols.r1{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
  .wform-f{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:8px;margin:0 -14px;padding:10px 14px 12px;
    background:var(--sunk);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .wform-f .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .wform.wflash{animation:wformflash 1.4s ease-out}
  @keyframes wformflash{0%,35%{box-shadow:0 0 0 1.5px var(--accent),0 0 0 7px var(--ring)}100%{box-shadow:0 0 0 1.5px var(--accent),0 0 0 7px transparent}}
  .lrow.wflash{animation:wflash 1.8s ease-out;border-radius:8px}
  @keyframes wflash{0%,35%{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
  .pc.wflash,.addlink.wflash{animation:wring 1.6s ease-out}
  @keyframes wring{0%,35%{box-shadow:0 0 0 3px var(--ring)}100%{box-shadow:0 0 0 3px transparent}}
  @media (max-width:640px){
    .wcols,.wcols.c2,.wcols.r1{grid-template-columns:minmax(0,1fr)}
    .wform{margin-left:-8px;margin-right:-8px;padding-left:12px;padding-right:12px}
    .wform-f{margin:0 -12px;padding-left:12px;padding-right:12px}
    .wform-f .hint{display:none}
  }
  @media (min-width:1180px){
    .wgrid:not(.solo){max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto 1fr;column-gap:22px;align-items:start}
    .wgrid:not(.solo) .w-main{grid-column:1;grid-row:1 / 5}
    .wgrid:not(.solo) .w-rules{grid-column:2;grid-row:1}
    .wgrid:not(.solo) .w-intent{grid-column:2;grid-row:2}
    .wgrid:not(.solo) .w-routine{grid-column:2;grid-row:3}
    .wbar,.wtop{max-width:1080px}
  }
  @media (max-width:1179px){ .wbar,.wtop{max-width:720px} }

  /* ============ 响应式 ============ */
  @media (max-width:1199px){
    .insp{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:60;box-shadow:var(--pop);border-left:0;animation:slidein .18s ease}
  }
  @media (max-width:819px){
    .side{width:204px}
    .mhead{padding:8px 12px;gap:8px}
    .mhead > .grow{display:none}
    .mhead .who{flex:1}
    .head-acts{gap:0}
    #convTabs{order:5;width:100%}
    #convTabs button{flex:1}
    .gauge .bar,.gauge .lbl{display:none}
    .pbar{padding:8px 12px}
    .search{flex:1 1 100%}
    .stream{padding:8px 14px 120px}
    .req,.scene{padding:16px 14px 80px}
  }
  /* 手机：侧边栏收起，从左上角菜单拉出来 */
  @media (max-width:640px){
    .side{position:fixed;top:0;left:0;bottom:0;z-index:65;width:min(280px,86vw);box-shadow:var(--pop);transform:translateX(-105%);transition:transform .2s ease}
    .app.side-open .side{transform:none}
    .narrow-only{display:inline-flex !important}
    .col{max-width:88%}
    .row.tl .col{padding-left:0}
    .gap::before{left:8px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head"><span class="brand">上下文</span><span class="brand-sub">超级增强</span></div>
    <div class="side-scroll scroll">
      <div class="side-label">会话</div>
      <nav class="nav" id="convNav"></nav>
      <div class="side-label">世界</div>
      <nav class="nav" id="worldNav"></nav>
    </div>
  </aside>

  <main class="main">
    <!-- 会话 -->
    <section class="view" id="convView">
      <header class="mhead">
        <button class="btn quiet ibtn narrow-only" data-icon="menu" data-open-side title="会话列表" type="button"></button>
        <div class="who" id="convWho"></div>
        <div class="seg" id="convTabs">
          <button type="button" data-tab="history">历史</button>
          <button type="button" data-tab="requests">请求快照</button>
        </div>
        <div class="grow"></div>
        <div class="gauge" id="gauge"></div>
        <div class="head-acts">
          <button class="btn quiet ibtn" id="undoBtn" data-icon="undo" title="撤销上一次修改" type="button"></button>
          <button class="btn quiet ibtn" id="refreshBtn" data-icon="refresh" title="刷新" type="button"></button>
        </div>
      </header>

      <div class="pane" id="histPane">
        <div class="pbar">
          <label class="search">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input class="inp" id="q" type="text" placeholder="搜索已加载的消息（按 / 聚焦）" autocomplete="off" />
            <button class="clr" id="qClear" type="button" title="清除" hidden></button>
          </label>
          <span class="hint" id="qHint"></span>
          <div class="grow"></div>
          <button class="chip-t" id="multiBtn" type="button" title="也可以按住 Shift / ⌘ 点消息">多选</button>
          <button class="btn sm" id="newBtn" type="button" data-icon="plus">新条目</button>
        </div>
        <div class="scroller scroll" id="histScroll"><div class="stream" id="stream"></div></div>
        <button class="newpill" id="newPill" type="button" hidden></button>
        <div class="selbar" id="selBar" hidden>
          <span>已选 <b id="selN">0</b> 条</span>
          <button class="btn quiet sm" id="selAll" type="button">全选</button>
          <button class="btn quiet sm" id="selClear" type="button">取消</button>
          <button class="btn quiet sm" id="selThink" type="button">清空思考</button>
          <button class="btn sm danger" id="selDel" type="button">删除</button>
        </div>
      </div>

      <div class="pane" id="reqPane" hidden>
        <div class="pbar">
          <button class="btn ibtn" id="reqOlder" data-icon="left" title="更早的一份" type="button"></button>
          <select class="inp" id="reqSel" style="flex:0 1 300px"></select>

      <header class="mhead">

    <section class="view" id="schView" hidden>

<script>
(function () {
  "use strict";

  /* ================= 基础工具 ================= */
  var PAGE = 200;
  var COMPRESS_AT = 0.82;
  var REMINDER_RE = /<system[-_\s]*reminder>[\s\S]*?<\/system[-_\s]*reminder>/gi;
  var STAMP_RES = [
    /Sent at:\s*(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/,
    /Current datetime:\s*(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/,
    /\[(\d{2})-(\d{2}) (\d{2}:\d{2})\]/
  ];

  var ICONS = {
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    refresh: '<path d="M20 11.5a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5v5h-5"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    chev: '<path d="m9 6 6 6-6 6"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 3.6 5.3 3.6 8.5s-1.2 6-3.6 8.5c-2.4-2.5-3.6-5.3-3.6-8.5s1.2-6 3.6-8.5z"/>',
    tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L4 16.7 7.3 20l5.3-5.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.7-.7-.7-2.7z"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    image: '<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m20 16-4.5-4.5L7 19"/>',
    insert: '<path d="M4 12h10M10 8l4 4-4 4M19 5v14"/>',
    spark: '<path d="M12 3.5l2.1 5.4 5.4 2.1-5.4 2.1L12 18.5l-2.1-5.4L4.5 11l5.4-2.1z"/>',
    cal: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>'
  };

  function icon(name) {
    var wrap = document.createElement("span");
    // 图标都是上面的静态字符串，不含任何用户数据
    wrap.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    return wrap.firstChild;
  }

  var PROPS = { value: 1, checked: 1, disabled: 1, hidden: 1, open: 1, rows: 1, placeholder: 1, title: 1, type: 1, selected: 1 };
  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) { return; }
        if (k === "class") { e.className = v; }
        else if (k === "text") { e.textContent = v; }
        else if (k === "style") { e.style.cssText = v; }
        else if (k === "data") { Object.keys(v).forEach(function (d) { e.dataset[d] = v[d]; }); }
        else if (k.slice(0, 2) === "on") { e.addEventListener(k.slice(2), v); }
        else if (PROPS[k]) { e[k] = v; }
        else { e.setAttribute(k, v === true ? "" : v); }
      });
    }
    for (var i = 2; i < arguments.length; i++) { add(e, arguments[i]); }
    return e;
  }
  function add(e, kid) {
    if (kid === null || kid === undefined || kid === false) { return; }
    if (Array.isArray(kid)) { kid.forEach(function (k) { add(e, k); }); return; }
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }
  function $(id) { return document.getElementById(id); }
  function clear(e) { while (e.firstChild) { e.removeChild(e.firstChild); } return e; }

  var store = {
    get: function (k, d) {
      try { var v = window.localStorage.getItem("se_ctx_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) {
      try { window.localStorage.setItem("se_ctx_" + k, JSON.stringify(v)); } catch (e) { /* 面板沙箱里不可用，忽略 */ }
    }
  };

  function bridge() { return window.AstrBotPluginPage; }
  function api(path, params) {
    var b = bridge();
    return b ? b.apiGet(path, params || {}) : Promise.reject(new Error("页面桥接未就绪"));
  }
  function post(path, body) {
    var b = bridge();
    return b ? b.apiPost(path, body || {}) : Promise.reject(new Error("页面桥接未就绪"));
  }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }

  function fmtN(n) { return Number(n || 0).toLocaleString("zh-CN"); }
  function fmtK(n) {
    n = Number(n || 0);
    if (n < 1000) { return String(Math.round(n)); }
    return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k";
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTs(ts, withSec) {
    var t = Number(ts);
    if (!t) { return ""; }
    var d = new Date(t * 1000);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + (withSec ? ":" + pad(d.getSeconds()) : "");
  }
  function relAgo(ts) {
    var t = Number(ts);
    if (!t) { return ""; }
    var s = Date.now() / 1000 - t;
    if (s < 60) { return "刚刚"; }
    if (s < 3600) { return Math.floor(s / 60) + " 分钟前"; }
    if (s < 86400) { return Math.floor(s / 3600) + " 小时前"; }
    return Math.floor(s / 86400) + " 天前";
  }
  function firstChar(s) {
    var a = Array.from(String(s || "").trim());
    return a.length ? a[0].toUpperCase() : "?";
  }
  // 头像色按顺序分配（先按共享场景里的角色顺序，再按平台名），保证不同机器人颜色不撞
  var HUES = ["h0", "h4", "h2", "h3", "h1", "h5"];
  function hueOf(key) {
    key = String(key || "");
    var order = Object.keys(S.labels);
    S.convs.map(function (c) { return String(c.umo || "").split(":")[0]; }).sort().forEach(function (p) {
      if (p && order.indexOf(p) < 0) { order.push(p); }
    });
    var k = order.indexOf(key);
    if (k < 0) {
      k = order.length;
      for (var i = 0; i < key.length; i++) { k += key.charCodeAt(i); }
    }
    return HUES[k % HUES.length];
  }
  function avatar(label, hue, size) {
    return h("span", { class: "av " + (hue || "h5") + (size ? " " + size : ""), text: firstChar(label) });
  }
  function splitReminder(text) {
    var s = String(text || "");
    var tags = s.match(REMINDER_RE) || [];
    return { body: s.replace(REMINDER_RE, "").replace(/^\s+|\s+$/g, ""), tags: tags };
  }
  function joinReminder(body, tags) {
    return tags.length ? body + "\n" + tags.join("\n") : body;
  }
  function stampOf(text) {
    for (var k = 0; k < STAMP_RES.length; k++) {
      var m = STAMP_RES[k].exec(text || "");
      if (!m) { continue; }
      return m.length === 5 ? m[2] + "-" + m[3] + " " + m[4] : m[1] + "-" + m[2] + " " + m[3];
    }
    return "";
  }
  function dayLabel(stamp) {
    var m = /^(\d{2})-(\d{2})/.exec(stamp || "");
    return m ? (+m[1]) + "月" + (+m[2]) + "日" : "";
  }
  // 把文本写进元素，搜索词高亮（全部走文本节点，不拼 HTML）
  function setHL(el, text, q) {
    clear(el);
    text = String(text || "");
    if (!q) { el.textContent = text; return el; }
    var low = text.toLowerCase(), ql = q.toLowerCase(), pos = 0, k;
    while ((k = low.indexOf(ql, pos)) >= 0) {
      if (k > pos) { el.appendChild(document.createTextNode(text.slice(pos, k))); }
      el.appendChild(h("mark", { text: text.slice(k, k + ql.length) }));
      pos = k + ql.length;
    }
    if (pos < text.length) { el.appendChild(document.createTextNode(text.slice(pos))); }
    return el;
  }
  function autosize(ta, max) {
    var fit = function () {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight + 2, max || 480) + "px";
    };
    ta.addEventListener("input", fit);
    requestAnimationFrame(fit);
    return ta;
  }
  function isNarrow() { return window.matchMedia("(max-width: 640px)").matches; }
  function insOverlay() { return window.matchMedia("(max-width: 1199px)").matches; }

  /* ================= 提示与确认 ================= */
  var toastTimer = null;
  function toast(msg, opt) {
    opt = opt || {};
    var t = clear($("toast"));
    t.className = "toast" + (opt.err ? " err" : "");
    t.appendChild(h("span", { text: msg }));
    if (opt.action) {
      t.appendChild(h("button", {
        class: "act", type: "button", text: opt.action.label,
        onclick: function () { t.hidden = true; opt.action.run(); }
      }));
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, opt.ms || (opt.action ? 8000 : opt.err ? 6000 : 2600));
  }

  // 面板的 iframe 沙箱不允许 confirm()，确认框自己画
  var modalDone = null;
  function confirmDlg(o) {
    return new Promise(function (resolve) {
      $("mTitle").textContent = o.title || "确认";
      $("mBody").textContent = o.body || "";
      $("mBody").hidden = !o.body;
      var ok = $("mOk");
      ok.textContent = o.ok || "确定";
      ok.className = "btn " + (o.danger ? "danger armed" : "pri");
      $("modal").hidden = false;
      modalDone = function (v) { $("modal").hidden = true; modalDone = null; resolve(v); };
      setTimeout(function () { ok.focus(); }, 0);
    });
  }
  $("mOk").addEventListener("click", function () { if (modalDone) { modalDone(true); } });
  $("mCancel").addEventListener("click", function () { if (modalDone) { modalDone(false); } });
  $("modal").addEventListener("click", function (ev) { if (ev.target === $("modal") && modalDone) { modalDone(false); } });

  // 两段式按钮：第一次点变成「确认…」，3 秒内再点才执行
  function armed(btn, label, run, reset) {
    var t = null, orig = [];
    function restore() {
      clearTimeout(t);
      if (!btn.classList.contains("armed")) { return; }
      btn.classList.remove("armed");
      clear(btn);
      orig.forEach(function (n) { btn.appendChild(n); });
      if (reset) { reset(); }
    }
    btn.addEventListener("click", function () {
      if (btn.classList.contains("armed")) { restore(); run(); return; }
      orig = Array.prototype.slice.call(btn.childNodes);
      btn.classList.add("armed");
      btn.textContent = label;
      t = setTimeout(restore, 3000);
    });
    return btn;
  }

  function copyText(text) {
    var done = function (ok) { toast(ok ? "已复制" : "复制失败：面板不允许访问剪贴板", { err: !ok }); };
    function fallback() {
      try {
        var ta = h("textarea", { style: "position:fixed;left:-9999px;top:0;opacity:0" });
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        done(ok);
      } catch (e) { done(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  /* ================= 状态 ================= */
  var S = {
    convs: [], convErr: "", labels: {},
    scene: null, sceneAt: 0, sceneErr: "", sceneLoading: false,
    view: "conv", cid: "", tab: store.get("tab", "history") === "requests" ? "requests" : "history",
    items: [], range: null, histErr: "", histLoading: false,
    q: "", showThink: false, flips: {}, openText: {},
    multi: false, multiAuto: false, sel: {}, anchor: null,
    insp: null,
    req: { list: [], idx: 0, data: null, err: "", disabled: false, tab: store.get("reqTab", "inject"), all: false, raw: false, loading: false },
    edits: {}, auto: true, drawer: false,
    ledger: null, ledgerErr: "", ledgerLoading: false, ledEdit: {}, ledShowPast: false, trEdit: {},
    pools: null, poolsErr: "", poolsLoading: false, poolEdit: {}, poolQ: "",
    world: null, worldErr: "", worldLoading: false, worldDate: "", worldWho: "", worldBusy: "", worldShowLifted: false, worldShowStatus: false,
    wEdit: {}, cEdit: {}, iEdit: {}, rEdit: {},
    sch: null, schErr: "", schLoading: false, schBot: store.get("schBot", ""), schDate: ""
  };

  function curConv() {
    for (var i = 0; i < S.convs.length; i++) { if (S.convs[i].cid === S.cid) { return S.convs[i]; } }
    return null;
  }
  function convInfo(c) {
    var parts = String(c.umo || "").split(":");
    var plat = parts[0] || c.platform || "";
    var kind = parts[1] === "FriendMessage" ? "私聊" : parts[1] === "GroupMessage" ? "群聊" : (parts[1] || "");
    var peer = parts.slice(2).join(":");
    var label = S.labels[plat] || c.persona_id || plat || "会话";
    return { plat: plat, label: label, sub: [kind, peer].filter(Boolean).join(" · "), hue: hueOf(plat || c.cid) };
  }
  function curInfo() {
    var c = curConv();
    return c ? convInfo(c) : { label: "她", hue: "h5", sub: "" };
  }
  function roleName(role) {
    if (role === "user") { return "用户"; }
    if (role === "assistant") { return curInfo().label; }
    if (role === "tool") { return "工具回包"; }
    return role || "?";
  }
  function itemByIndex(i) {
    for (var k = 0; k < S.items.length; k++) { if (S.items[k].i === i) { return S.items[k]; } }
    return null;
  }

  /* ================= 侧栏 ================= */
  function renderSide() {
    var nav = clear($("convNav"));
    if (!S.convs.length) {
      nav.appendChild(h("div", { class: "side-empty", text: S.convErr ? "加载失败：" + S.convErr : "还没有会话" }));
    }
    S.convs.forEach(function (c) {
      var info = convInfo(c);
      var on = S.view === "conv" && c.cid === S.cid;
      nav.appendChild(h("button", {
        class: "nav-item" + (on ? " on" : ""), type: "button", title: c.umo + "\n" + fmtN(c.items) + " 条",
        onclick: function () { selectConv(c.cid); }
      },
        avatar(info.label, info.hue),
        h("span", { class: "nav-t" }, h("span", { class: "nav-n", text: info.label }), h("span", { class: "nav-s", text: info.sub })),
        h("span", { class: "nav-r", text: fmtK(c.estimate_tokens) })
      ));
    });

    var world = clear($("worldNav"));
    var wlive = worldLive();
    var wg = h("span", { class: "av hm" });
    wg.appendChild(icon("clock"));
    var wsub = "读取中…";
    if (S.worldErr && !S.world) { wsub = "不可用"; }
    else if (S.world) {
      var wst = S.world.status || {};
      wsub = wst.mode === "off" ? "已关闭" : (wst.mode === "shadow" ? "影子运行" : "live") +
        (wst.last_step ? " · 上次补写 " + String(wst.last_step).slice(11, 16) : "");
    }
    world.appendChild(h("button", {
      class: "nav-item" + (S.view === "world" ? " on" : ""), type: "button",
      onclick: function () { openWorld(); }
    }, wg, h("span", { class: "nav-t" }, h("span", { class: "nav-n", text: "世界线" }), h("span", { class: "nav-s", text: wsub })),
      wlive ? h("span", { class: "dot on", title: "live" }) : null));

    // 旧版（世界线 live 之后不用了，先注释掉）：共享场景入口
    // var sub = "读取中…";
    // if (S.sceneErr && !S.scene) { sub = "不可用"; }
    // else if (S.scene) {
      // var m = (S.scene.raw || {}).master || {};
      // sub = !S.scene.enabled ? "已关闭" : (m.doing || m.place) ? "主人：" + (m.doing || m.place) : "主人行踪未知";
    // }
    // var g = h("span", { class: "av hm" });
    // g.appendChild(icon("globe"));
    // world.appendChild(h("button", {

  function loadHistory(mode, added) {

    if (!cid) { return Promise.resolve(); }
    var params = { cid: cid, limit: PAGE };
    if (mode === "older" && S.range) { params.end = S.range.start; }
    if ((mode === "keep" || mode === "poll") && S.items.length) { params.limit = Math.min(2000, Math.max(PAGE, S.items.length + Math.max(0, added || 0))); }
    if (mode === "fresh") { S.histLoading = true; S.histErr = ""; hideNewPill(); renderStream(); }
    var sc = $("histScroll");
    var oldH = sc.scrollHeight, oldTop = sc.scrollTop, wasBottom = nearBottom();
    return api("ctx/history", params).then(function (d) {
      if (cid !== S.cid) { return; }
      S.histLoading = false;
      var items = (d && d.items) || [];
      if (mode === "older") {
        var tail = S.items.filter(function (it) { return it.i >= d.end; });
        S.items = items.concat(tail);
        S.range = Object.assign({}, d, { end: S.range ? S.range.end : d.end });
      } else {
        S.items = items;
        S.range = d;
      }
      var c = curConv();
      if (c) { c.items = d.total; c.estimate_tokens = d.estimate_tokens; c.token_usage = d.token_usage; }
      // 选中的条目在新数据里不在了就丢掉
      Object.keys(S.sel).forEach(function (k) { if (!itemByIndex(+k)) { delete S.sel[k]; } });
      if (S.insp && S.insp.kind === "msg" && !itemByIndex(S.insp.i)) { closeInsp(true); }
      if (mode === "keep" || mode === "poll") { keepScroll(renderStream); } else { renderStream(); }
      renderHead();
      renderSide();

      if (S.insp && !(mode === "poll" && (S.insp.dirty || $("insp").contains(document.activeElement)))) { renderInsp(); }
      if (mode === "fresh") { sc.scrollTop = sc.scrollHeight; }
      else if (mode === "older") { sc.scrollTop = oldTop + (sc.scrollHeight - oldH); }
      else if (mode === "poll") {
        if (wasBottom) { sc.scrollTop = sc.scrollHeight; }
        else if (added > 0) { showNewPill(added); }
      }
    }).catch(function (e) {
      if (cid !== S.cid) { return; }
      S.histLoading = false;

      if (mode === "fresh") { S.histErr = errMsg(e); renderStream(); }
      else { toast("加载失败：" + errMsg(e), { err: true }); renderStream(); }
    });
  }

  /* ---------- 工具列表：取自这个会话最近一次真实请求里带的工具定义 ---------- */
  var toolCache = {};
  function loadToolDefs() {
    var c = curConv();
    if (!c) { return Promise.resolve([]); }
    var umo = c.umo;
    if (toolCache[umo]) { return Promise.resolve(toolCache[umo]); }
    var got = S.req.data && S.req.data.umo === umo ? Promise.resolve(S.req.data.tools || []) :
      api("ctx/requests", { umo: umo, limit: 1 }).then(function (d) {

        return api("ctx/request", { id: it.id }).then(function (snap) { return (snap && snap.tools) || []; });
      });

      var seen = {};

        });
      });
      list.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
      if (list.length) { toolCache[umo] = list; }
      return list;
    });
  }
  function toolDef(list, name) {
    for (var k = 0; k < (list || []).length; k++) { if (list[k].name === name) { return list[k]; } }
    return null;

  function toolName(st) {

  function schemaOf(def) {
    var p = def && def.parameters;
    if (!p || typeof p !== "object") { return { props: {}, req: [], known: false }; }
    return { props: p.properties || {}, req: p.required || [], known: true };
  }
  function typeOf(sch) {
    var t = sch && sch.type;
    if (Array.isArray(t)) { t = t.filter(function (x) { return x !== "null"; })[0]; }
    return t || "string";

  var TYPE_CN = { string: "文本", integer: "整数", number: "数字", boolean: "是/否", array: "列表", object: "对象" };

  // 字段的可选值：schema 里的 enum，或者说明里写的「One of: a, b, c」
  function enumOf(sch) {
    if (Array.isArray(sch["enum"])) { return sch["enum"]; }
    var m = /one of:?\s*([A-Za-z0-9_]+(?:\s*[,，、]\s*[A-Za-z0-9_]+)+)/i.exec(String(sch.description || ""));
    return m ? m[1].split(/\s*[,，、]\s*/) : null;
  }
  function isObjList(sch) {

  // 一个基本字段的输入控件（文本 / 数字 / 是否 / 下拉 / 每行一项的列表 / JSON 对象）
  function fieldInput(sch, val, set, required) {

  // 按工具的参数定义生成表单；值存在 st.params 里（原始字符串；对象列表是数组）

        Object.keys(props).forEach(function (k) {
          var sub = props[k] || {}, r = req.indexOf(k) >= 0;

  // 把一个基本字段的原始字符串转成真正的值
  function convertValue(sch, v) {
    var type = typeOf(sch);
    v = String(v);
    if (type === "boolean") { return { ok: true, value: v === "true" }; }
    if (type === "integer" || type === "number") {
      var n = Number(v);
      if (isNaN(n) || (type === "integer" && Math.floor(n) !== n)) { return { ok: false }; }
      return { ok: true, value: n };
    }
    if (type === "array") {
      var itemType = typeOf(sch.items || {});
      var arr = v.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      if (itemType === "integer" || itemType === "number") {
        arr = arr.map(Number);
        if (arr.some(isNaN)) { return { ok: false }; }

      return { ok: true, value: arr };
    }
    if (type === "object") {
      try { return { ok: true, value: JSON.parse(v) }; } catch (e) { return { ok: false }; }
    }
    return { ok: true, value: v };
  }

  // 把表单值拼成参数 JSON；缺必填 / 格式不对时给出原因
  function buildArgs(st) {
    if (st.custom) {
      try { JSON.parse(st.targs || "{}"); return { ok: true, json: st.targs || "{}" }; } catch (e) { return { ok: false, err: "参数不是合法的 JSON" }; }
    }
    var def = toolDef(st.tools, st.tool);
    var s = schemaOf(def);
    if (!s.known) {
      var raw = st.params.__raw__ || "{}";
      try { JSON.parse(raw); return { ok: true, json: raw }; } catch (e) { return { ok: false, err: "参数不是合法的 JSON" }; }
    }
    var out = {}, missing = [], bad = [];
    var blank = function (v) { return v === undefined || String(v).trim() === ""; };
    Object.keys(s.props).forEach(function (key) {
      var sch = s.props[key] || {};
      var v = st.params[key];
      if (isObjList(sch)) {
        var props = sch.items.properties || {}, req = sch.items.required || [], arr = [];
        (Array.isArray(v) ? v : []).forEach(function (obj, idx) {
          var item = {}, any = false;
          Object.keys(props).forEach(function (k) {
            if (blank(obj[k])) { if (req.indexOf(k) >= 0) { missing.push(key + " 第" + (idx + 1) + "项的 " + k); } return; }
            var c = convertValue(props[k] || {}, obj[k]);
            if (c.ok) { item[k] = c.value; any = true; } else { bad.push(key + " 第" + (idx + 1) + "项的 " + k); }
          });
          if (any) { arr.push(item); }
        });
        if (arr.length) { out[key] = arr; }
        else if (s.req.indexOf(key) >= 0 && !missing.length) { missing.push(key); }
        return;
      }
      if (blank(v)) { if (s.req.indexOf(key) >= 0) { missing.push(key); } return; }
      var c = convertValue(sch, v);
      if (c.ok) { out[key] = c.value; } else { bad.push(key); }
    });
    if (missing.length) { return { ok: false, err: "还没填必填参数：" + missing.join("、") }; }
    if (bad.length) { return { ok: false, err: "格式不对：" + bad.join("、") }; }
    return { ok: true, json: JSON.stringify(out) };
  }

  /* ---------- 新条目 ---------- */
  function renderCompose(box) {
    var st = S.insp;
    var label = curInfo().label;

    var body = h("div", { class: "pb scroll" });
    var submit = h("button", { class: "btn pri", type: "button", text: "插入", title: "⌘/Ctrl + Enter" });
    var setDirty = function () { st.dirty = !!(st.text || st.think || st.tname || st.tout || st.tool); validate(); };

    var seg = h("div", { class: "seg", style: "margin-bottom:18px" });

        type: "button", class: st.role === r[0] ? "on" : "", text: r[1],

    var main = autosize(h("textarea", { class: "ta" + (st.role === "tool" ? " mono" : ""), rows: 4, placeholder: st.role === "tool" ? "工具返回的内容" : st.role === "user" ? "用户说的话" : label + "说的话" }), 420);
    main.value = st.text;
    main.addEventListener("input", function () { st.text = main.value; setDirty(); });
    body.appendChild(h("div", { class: "fld" }, h("div", { class: "fld-l" }, h("span", { text: st.role === "tool" ? "回包内容" : "正文" })), main));

    var argsNote = null;
    if (st.role === "assistant") {

        tt.addEventListener("input", function () { st.think = tt.value; setDirty(); });

        ft.appendChild(tt);
      } else {
        ft.appendChild(h("button", { class: "addlink", type: "button", onclick: function () { st.showThink = true; renderInsp(); } }, icon("plus"), "添加思考链"));

      var fc = h("div", { class: "fld" });
      if (st.showTool) {

        } else {

          pickSel.appendChild(h("option", { value: "", text: st.tools.length ? "选择工具…" : "（没读到工具列表）" }));
          st.tools.forEach(function (t) {
            var d1 = String(t.description || "").trim().split("\n")[0];
            pickSel.appendChild(h("option", { value: t.name, text: t.name + (d1 ? " — " + d1.slice(0, 28) : "") }));
          });
          pickSel.appendChild(h("option", { value: "__custom__", text: "其他（手写工具名）" }));
          pickSel.value = st.custom ? "__custom__" : st.tool;

          else if (!st.tools.length) { fc.appendChild(h("div", { class: "fld-n", text: "这个会话还没有请求快照，读不到工具列表；可以选「其他」手写。" })); }

          if (st.custom) {
            var tn = h("input", { class: "inp", type: "text", placeholder: "工具名", style: "width:100%;margin-top:10px" });
            tn.value = st.tname;
            tn.addEventListener("input", function () { st.tname = tn.value; setDirty(); });
            var ta = autosize(h("textarea", { class: "ta mono", rows: 2, placeholder: "{}" }), 260);
            ta.value = st.targs;
            ta.addEventListener("input", function () { st.targs = ta.value; validate(); });
            fc.appendChild(tn);

            fc.appendChild(ta);

            fc.appendChild(paramForm(def, st, validate));

          to.value = st.tout;
          to.addEventListener("input", function () { st.tout = to.value; setDirty(); });
          fc.appendChild(h("div", { class: "fld-l", style: "margin-top:14px" }, h("span", { text: "工具回包" })));
          fc.appendChild(to);

      } else {

    var open = (S.range && S.range.open_tool_calls) || [];
    if (st.role === "tool") {
      var fs = h("div", { class: "fld" }, h("div", { class: "fld-l" }, h("span", { text: "回给哪个工具调用" })));
      if (!open.length) {

      } else {
        var sel = h("select", { class: "inp", style: "width:100%" });
        open.forEach(function (c) { sel.appendChild(h("option", { value: c.id, text: (c.name || "?") + " · " + c.id })); });
        if (!st.target || !open.some(function (c) { return c.id === st.target; })) { st.target = open[0].id; }
        sel.value = st.target;
        sel.addEventListener("change", function () { st.target = sel.value; });

    box.appendChild(body);

    function validate() {
      var ok;
      if (st.role === "user") { ok = !!st.text.trim(); }
      else if (st.role === "tool") { ok = !!st.text.trim() && open.length > 0; }
      else { ok = !!(st.text.trim() || st.think.trim() || toolName(st)); }
      if (argsNote) {
        var built = toolName(st) ? buildArgs(st) : { ok: true };
        argsNote.textContent = built.ok ? "" : built.err;
        argsNote.style.color = built.ok ? "" : "var(--danger)";
        ok = ok && built.ok;
      }
      submit.disabled = !ok;
    }
    validate();

    submit.addEventListener("click", function () { doAppend(submit); });
    var cancel = h("button", { class: "btn", type: "button", text: "取消", onclick: function () { closeInsp(); } });
    box.appendChild(h("div", { class: "pf" }, h("span", { class: "grow" }), cancel, submit));
    setTimeout(function () { main.focus(); }, 0);
  }

  function doAppend(btn) {
    var st = S.insp;
    var payload = { cid: S.cid, role: st.role, after: st.after, text: st.text };
    if (st.role === "assistant") {
      payload.think = st.think;
      if (toolName(st)) {
        var built = buildArgs(st);
        if (!built.ok) { toast(built.err, { err: true }); return; }
        payload.tool_calls = [{ name: toolName(st), arguments: built.json }];
        payload.tool_output = st.tout;
      }
    } else if (st.role === "tool") {
      payload.tool_call_id = st.target || "";
    }
    btn.disabled = true;
    post("ctx/append", payload).then(function (r) {
      st.dirty = false;
      var at = r && typeof r.start === "number" ? r.start : null;
      toast("已插入 " + ((r && r.added) || 1) + " 条", { action: { label: "撤销", run: function () { doUndo(true); } } });
      closeInsp(true);
      return loadHistory("keep").then(function () {
        if (at !== null && itemByIndex(at)) { openMsg(at); scrollToItem(at, true); }
      });
    }).catch(function (e) {
      btn.disabled = false;
      toast("插入失败：" + errMsg(e), { err: true });
    });

  $("newBtn").addEventListener("click", function () { startCompose(-1); });

  /* ================= 请求快照 ================= */
  function loadRequests() {
    var c = curConv();
    if (!c) { renderReq(); return; }
    S.req.loading = true;
    S.req.err = "";
    renderReq();
    var keepId = S.req.list[S.req.idx] ? S.req.list[S.req.idx].id : "";
    api("ctx/requests", { umo: c.umo, limit: 30 }).then(function (d) {
      if (!curConv() || curConv().umo !== c.umo) { return; }
      S.req.list = (d && d.items) || [];
      S.req.disabled = !!(d && d.disabled);
      var idx = 0;
      S.req.list.forEach(function (x, k) { if (x.id === keepId) { idx = k; } });
      S.req.idx = idx;
      renderReqBar();
      if (S.req.list.length) { loadSnap(); }
      else { S.req.loading = false; S.req.data = null; renderReq(); }
    }).catch(function (e) {
      S.req.loading = false;
      S.req.err = errMsg(e);
      renderReqBar();
      renderReq();
    });
  }

  function loadSnap(quiet) {
    var item = S.req.list[S.req.idx];
    if (!item) { return; }
    S.req.loading = true;
    S.req.err = "";
    if (!quiet) {
      S.req.data = null;
      renderReqBar();
      renderReq();
    }
    var top = $("reqScroll").scrollTop;
    api("ctx/request", { id: item.id }).then(function (snap) {
      if (S.req.list[S.req.idx] !== item) { return; }
      S.req.loading = false;
      S.req.data = snap;
      renderReq();
      $("reqScroll").scrollTop = quiet ? top : 0;
    }).catch(function (e) {
      if (S.req.list[S.req.idx] !== item) { return; }
      S.req.loading = false;
      S.req.err = errMsg(e);
      renderReq();
    });
  }

  function renderReqBar() {
    var sel = clear($("reqSel"));
    S.req.list.forEach(function (it, k) {
      var st = it.stats || {};
      sel.appendChild(h("option", { value: String(k), text: fmtTs(it.ts, true) + " · " + fmtN(st.context_messages) + " 条消息" + (k === 0 ? "（最新）" : "") }));
    });
    sel.value = String(S.req.idx);
    sel.disabled = !S.req.list.length;
    $("reqOlder").disabled = S.req.idx >= S.req.list.length - 1;
    $("reqNewer").disabled = S.req.idx <= 0;
    $("reqHint").textContent = S.req.list.length ? "第 " + (S.req.idx + 1) + " / " + S.req.list.length + " 份" : "";
  }
  $("reqSel").addEventListener("change", function () { S.req.idx = +$("reqSel").value; loadSnap(); });
  $("reqOlder").addEventListener("click", function () { if (S.req.idx < S.req.list.length - 1) { S.req.idx++; loadSnap(); } });
  $("reqNewer").addEventListener("click", function () { if (S.req.idx > 0) { S.req.idx--; loadSnap(); } });

  // 注入块的名字：取开头有辨识度的标记，如【动态生活状态】、<RAG-Faiss-Memory>
  function blockName(text) {
    var s = String(text || "").trim();
    if (/^<system[-_\s]*reminder>/i.test(s)) { return "系统提醒（用户信息与时间）"; }
    var m = /^(【[^】]{1,20}】|<[A-Za-z][\w-]{1,40}>)/.exec(s);
    if (m) { return m[1]; }
    return s.split("\n")[0].slice(0, 30) || "文本";
  }

  // 阅读模式：去掉行首缩进；「#」开头的行当小标题；连续空行压成一行；**粗体** 显示成粗体
  function docEl(text, raw) {
    var d = h("div", { class: "doc" + (raw ? " raw" : "") });
    if (raw) { d.textContent = text; return d; }
    var segs = [];
    String(text || "").split("\n").forEach(function (ln) {
      var t = ln.replace(/^[ \t]+/, "");
      var m = /^#{1,6}\s+(.*)$/.exec(t);
      if (m) { segs.push({ hd: m[1] }); return; }
      var last = segs[segs.length - 1];
      if (!last || last.hd !== undefined) { last = { lines: [] }; segs.push(last); }
      last.lines.push(t);
    });
    segs.forEach(function (s) {
      if (s.hd !== undefined) { d.appendChild(inlineMd(h("div", { class: "hd" }), s.hd)); return; }
      var out = [], blank = false;
      s.lines.forEach(function (l) {
        if (!l.trim()) { if (out.length && !blank) { out.push(""); } blank = true; }
        else { out.push(l); blank = false; }
      });
      while (out.length && !out[out.length - 1].trim()) { out.pop(); }
      if (out.length) { d.appendChild(inlineMd(h("div", { class: "para" }), out.join("\n"))); }
    });
    return d;
  }
  function inlineMd(el, text) {
    String(text).split(/\*\*([^*\n]+)\*\*/).forEach(function (p, k) {
      if (p) { el.appendChild(k % 2 ? h("b", { text: p }) : document.createTextNode(p)); }
    });
    return el;
  }

  var REQ_TABS = [["inject", "临时注入"], ["system", "系统提示"], ["input", "本次输入"], ["tools", "工具"]];

  function renderReq() {
    var box = clear($("reqBody"));
    var r = S.req;
    if (!REQ_TABS.some(function (t) { return t[0] === r.tab; })) { r.tab = "inject"; }
    if (!curConv()) { box.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "选一个会话" }))); return; }
    if (r.err) {
      box.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "读取失败" }), h("div", { text: r.err }),
        h("button", { class: "btn sm", type: "button", text: "重试", onclick: loadRequests })));
      return;
    }
    if (r.loading && !r.data) {
      box.appendChild(h("div", { class: "sk", style: "height:28px;width:40%;margin:6px 0 20px" }));
      box.appendChild(h("div", { class: "sk", style: "height:10px;margin-bottom:28px" }));
      box.appendChild(h("div", { class: "sk", style: "height:220px" }));
      return;
    }
    if (!r.list.length) {
      box.appendChild(h("div", { class: "empty-state" },
        h("div", { class: "big", text: r.disabled ? "请求快照没有开启" : "还没有快照" }),
        h("div", { text: r.disabled ? "在插件配置「⑪ 真实请求快照」里打开后，每次请求都会留一份。" : "等她下一次回复以后，这里就能看到那次真正发给模型的内容。" })));
      return;
    }
    var snap = r.data;
    if (!snap) { return; }
    var st = snap.stats || {};
    var listItem = r.list[r.idx] || {};
    var ts = snap.ts || listItem.ts;

    box.appendChild(h("div", { class: "req-title" },
      h("span", { class: "req-time", text: fmtTs(ts, true) || snap.time || "" }),
      h("span", { class: "req-sub", text: [relAgo(ts), snap.model ? "模型 " + snap.model : "默认模型"].filter(Boolean).join(" · ") })));

    var segs = [
      ["system", "系统提示", st.system_chars || 0, "--c1"],
      ["inject", "临时注入", st.extra_chars || 0, "--c2"],
      ["msgs", "历史消息", st.context_chars || 0, "--c3"],
      ["input", "本次输入", st.prompt_chars || 0, "--c4"]
    ];
    var total = segs.reduce(function (a, s) { return a + s[2]; }, 0) || 1;
    var comp = h("div", { class: "comp", title: "这次请求的字符构成" });
    segs.forEach(function (s) { if (s[2] > 0) { comp.appendChild(h("i", { style: "flex:" + (s[2] / total) + " 1 0;background:var(" + s[3] + ")", title: s[1] + " " + fmtN(s[2]) + " 字" })); } });
    box.appendChild(comp);
    var lg = h("div", { class: "legend" });
    segs.forEach(function (s) {
      var inner = [h("span", { class: "dot", style: "background:var(" + s[3] + ")" }), s[1] + " ", h("b", { text: fmtK(s[2]) }), " 字"];
      lg.appendChild(s[0] === "msgs"
        ? h("span", { title: "就是这个会话的落盘历史，在「历史」页看" }, inner)
        : h("button", { type: "button", onclick: function () { setReqTab(s[0]); } }, inner));
    });
    lg.appendChild(h("button", { type: "button", onclick: function () { setReqTab("tools"); } }, "工具 ", h("b", { text: String(st.tool_count || 0) }), " 个"));
    if (st.image_count) { lg.appendChild(h("span", null, "图片 ", h("b", { text: String(st.image_count) }), " 张")); }
    box.appendChild(lg);

    var parts = snap.extra_user_content_parts || [];
    var counts = { inject: parts.length, system: null, input: null, tools: (snap.tools || []).length };
    var tabs = h("div", { class: "tabs2" });
    REQ_TABS.forEach(function (t) {
      tabs.appendChild(h("button", { type: "button", class: r.tab === t[0] ? "on" : "", onclick: function () { setReqTab(t[0]); } },
        t[1], counts[t[0]] !== null ? h("span", { class: "n", text: String(counts[t[0]]) }) : null));
    });
    box.appendChild(tabs);

    var pane = h("div");
    box.appendChild(pane);
    if (r.tab === "system") { tabSystem(pane, snap); }
    else if (r.tab === "input") { tabInput(pane, snap); }
    else if (r.tab === "tools") { tabTools(pane, snap.tools || []); }
    else { tabInject(pane, parts); }
  }

  function setReqTab(t) {
    S.req.tab = t;
    store.set("reqTab", t);
    renderReq();
  }

  function rawToggle() {
    var b = h("button", { class: "chip-t" + (S.req.raw ? " on" : ""), type: "button", text: "原始格式", title: "按原样显示空格与缩进" });
    b.addEventListener("click", function () { S.req.raw = !S.req.raw; renderReq(); });

  function copyBtn(text) {

  function tabSystem(pane, snap) {
    var text = snap.system_prompt || "";
    pane.appendChild(h("div", { class: "tabhead" }, h("span", { class: "hint", text: fmtN(text.length) + " 字 · 人格 + 系统提醒 + 插件声明" }), h("span", { class: "grow" }), rawToggle(), copyBtn(text)));
    pane.appendChild(text ? docEl(text, S.req.raw) : h("div", { class: "muted", text: "（空）" }));
  }

  function tabInject(pane, parts) {
    if (!parts.length) { pane.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "这次没有临时注入" }))); return; }
    pane.appendChild(h("div", { class: "tabhead" }, h("span", { class: "hint", text: "插件在这次请求里临时加进去的内容，不写进历史" }), h("span", { class: "grow" }), rawToggle()));
    parts.forEach(function (p) {
      var text = typeof p === "string" ? p : (p && p.text);
      if (!text) { text = JSON.stringify(p, null, 2); }
      var preview = String(text).replace(REMINDER_RE, " ").replace(/\s+/g, " ").trim().slice(0, 90);
      var d = h("details", { class: "card", open: parts.length <= 1 },

  function loadPools(silent) {
    if (S.poolsLoading) { return Promise.resolve(); }
    S.poolsLoading = true;
    return api("ctx/pools").then(function (d) {
      S.poolsLoading = false;
      S.pools = d;
      S.poolsErr = "";
      renderSide();
      if (S.view === "pool") { renderPools(); }
    }).catch(function (e) {
      S.poolsLoading = false;
      S.poolsErr = errMsg(e);
      renderSide();
      if (S.view === "pool") { renderPools(); }
      if (!silent && S.view === "pool") { toast("读取失败：" + S.poolsErr, { err: true }); }
    });
  }

  function poolPost(body, okMsg, done) {
    return post("ctx/pools/edit", body).then(function () {
      if (done) { done(); }
      if (okMsg) { toast(okMsg); }
      return loadPools(true);
    }).catch(function (e) {
      toast("没保存：" + errMsg(e), { err: true });
    });
  }

  function poolLabel(kind) {
    var ks = (S.pools && S.pools.kinds) || [];
    for (var i = 0; i < ks.length; i++) { if (ks[i].kind === kind) { return ks[i].label; } }
    return kind;
  }

  function fmtW(w) { return String(Math.round(Number(w || 0) * 100) / 100); }

    if (diff === 1) { return "明天"; }

  /* ---------- 编辑框：同一时间只开一个 ---------- */
  // 每一项在页面上都有个 data-wk（条目 e:id、规矩 c:id、打算 i:谁、作息 r:谁），一项的「显示」和「编辑框」用同一个 key，

  function worldDirty(f) { return !!f && f._init !== undefined && JSON.stringify(f) !== f._init; }

  function worldOpenForms() {
    var out = [];
    Object.keys(W_MAPS).forEach(function (kind) {

  // 改过还没保存的那一个（没有就 null）

  // 打开编辑框：就地展开，原来那一行的位置不动；放不下就平滑地往下带一点，让整个框露出来
  function worldOpen(kind, key, f) {

  function worldScroller() { return $("worldBody").parentNode; }

  // 记下一个锚：指定的那一项；没指定就用视口里最上面看得见的几项（先找时间线）。停在最顶上时不记，重画后还在最顶上
  function worldAnchor(wk, clamp) {
    var sc = worldScroller(), top0 = sc.getBoundingClientRect().top;

    if (el) {

      if (clamp) { t = Math.max(12, Math.min(t, sc.clientHeight - 96)); }
      return { key: wk, top: t, alt: [] };
    }
    if (sc.scrollTop < 2) { return null; }
    var list = $("worldBody").querySelectorAll(".w-main [data-wk]");
    if (!list.length) { list = $("worldBody").querySelectorAll("[data-wk]"); }
    var found = [];
    for (var i = 0; i < list.length && found.length < 4; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom > top0 + 4 && r.top < top0 + sc.clientHeight) { found.push({ key: list[i].getAttribute("data-wk"), top: r.top - top0 }); }

  }

  // 重画后把锚放回原来的高度（先试 toKey，再试原来的锚和备选）；返回放好的那个元素
  function worldPlace(anchor, toKey) {

  // "2026-10-12 19:21[:05]" → 毫秒数（按世界线的本地时间当 UTC 算，只用来相减）
  function worldMs(t) {
    var m = /(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/.exec(String(t || ""));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;
  }

  // 此刻（世界线的钟）：本机时间加上和服务器的差
  function worldNowMs() { return Date.now() + (S.worldOffset || 0); }

  // 这段事做到百分之几（带小数）；没写结束返回 null
  function worldPct(e) {
    var a = worldMs(e.start), b = worldMs(e.end);
    if (a === null || b === null || b <= a) { return null; }
    return Math.max(0, Math.min(100, (worldNowMs() - a) / (b - a) * 100));
  }

  // 分步：进行中的标出正在做的那步（和注入给她的同一个算法：有分钟按分钟比例，没有按步数平分）
  function worldStepMins(e) {
    var steps = e.steps || [], m = e.step_minutes || [];
    return m.length === steps.length && m.length && m.every(function (x) { return +x > 0; }) ? m.map(Number) : null;
  }
  function worldStepIndex(n, pct, mins) {
    if (!mins) { return Math.min(n - 1, Math.floor(pct * n / 100)); }
    var left = pct / 100 * mins.reduce(function (a, b) { return a + b; }, 0);
    for (var i = 0; i < mins.length; i++) { left -= mins[i]; if (left < 0) { return i; } }
    return n - 1;
  }
  // 进度条：有分步时走正在做的那一步（做到几成、几点做完），没分步走整段。
  // 分步的起止按分钟比例（没分钟按步数平分）摊在整段上，和 worldStepIndex 同一个算法。
  function worldProg(el, now) {
    var a = +el.getAttribute("data-a"), b = +el.getAttribute("data-b");
    if (!(b > a)) { return null; }
    var pct = Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
    var n = +el.getAttribute("data-n") || 0, width = pct;
    var text = Math.floor(pct) + "% · 预计 " + el.getAttribute("data-end") + " 做完";
    if (n > 0) {
      var dm = el.getAttribute("data-m"), mins = dm ? dm.split(",").map(Number) : null;
      var at = worldStepIndex(n, pct, mins);
      var total = mins ? mins.reduce(function (x, y) { return x + y; }, 0) : n;
      var done = mins ? mins.slice(0, at).reduce(function (x, y) { return x + y; }, 0) : at;
      var s0 = a + (b - a) * done / total, s1 = a + (b - a) * (done + (mins ? mins[at] : 1)) / total;
      width = s1 > s0 ? Math.max(0, Math.min(100, (now - s0) / (s1 - s0) * 100)) : 100;
      text = Math.floor(width) + "% · 预计 " + new Date(s1).toISOString().slice(11, 16) + " 做完";
    }
    el.querySelector(".wprog-bar").style.width = width.toFixed(2) + "%";
    el.querySelector(".wprog-t").textContent = text;
    return pct;
  }

  function worldSteps(e, pct) {
    var steps = e.steps || [];
    if (!steps.length) { return null; }
    var mins = worldStepMins(e);
    var at = pct === null ? -1 : worldStepIndex(steps.length, pct, mins);
    var box = h("ol", { class: "wsteps", "data-m": mins ? mins.join(",") : "" });
    steps.forEach(function (t, i) {
      box.appendChild(h("li", { class: i < at ? "done" : i === at ? "now" : "", text: mins ? t + " · " + mins[i] + " 分钟" : t }));
    });
    return box;
  }

  function worldProgBar(e) {

  // 分步：一步一行，做什么和几分钟分开填；可以加一步、删一步
