        p.then(function () { save.disabled = false; cancel.disabled = false; save.textContent = saveText; });
      }
    }
    cancel.addEventListener("click", function () { if (!cancel.disabled) { onCancel(); } });
    save.addEventListener("click", doSave);
    box.addEventListener("keydown", function (ev) {
      if (ev.isComposing || ev.keyCode === 229) { return; }
      if (ev.key === "Escape") {
        // 不往上冒：全局的 Esc 会把刚弹出来的确认框当场关掉

        } else { onCancel(); }

    });

  // 整页重画。opt：
  //   key    以这一项为锚（开 / 关编辑框时就是那一项）；不给就用视口里最上面看得见的那项，重画后放回原来的高度

  //   loaded 读完数据后的重画：顺带处理存完要停在哪（S.worldFocus）
  function renderWorld(opt) {

    var anchor = S.world && !toTop && !toNow ? worldAnchor(opt.key || (fx && fx.from) || "", !!(opt.clamp || fx)) : null;
    worldDraw();

    worldTick(worldNowMs());
    if (toNow) { worldScrollToNow(); return; }

    var toKey = fx ? (typeof fx.to === "function" ? fx.to(S.world) : fx.to) || "" : "";

    if (opt.flash || (fx && !el.classList.contains("wform"))) { worldFlash(el); }

  function worldThingIsObj(t) { return t.cat === "item" || /^p\d/i.test(String(t["new"] || t.id || "")); }

  function worldThingText(d, t) {

  /* ---------- 这个人的时间线 ---------- */
  function worldTimelineSection(d, who) {

      var jointMap = {}, jointList = [];

  // "2026-10-12 19:21[:05]" → 毫秒数（按世界线的本地时间当 UTC 算，只用来相减）
  function worldMs(t) {
    var m = /(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/.exec(String(t || ""));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;
  }

  // 此刻（世界线的钟）：本机时间加上和服务器的差
  function worldNowMs() { return Date.now() + (S.worldOffset || 0); }

  // 这段事做到百分之几（带小数）；没写结束返回 null
  function worldPct(e) {
    var a = worldMs(e.start), b = worldMs(e.end);
    if (a === null || b === null || b <= a) { return null; }
    return Math.max(0, Math.min(100, (worldNowMs() - a) / (b - a) * 100));
  }

  // 分步：进行中的标出正在做的那步（和注入给她的同一个算法：有分钟按分钟比例，没有按步数平分）
  function worldStepMins(e) {
    var steps = e.steps || [], m = e.step_minutes || [];
    return m.length === steps.length && m.length && m.every(function (x) { return +x > 0; }) ? m.map(Number) : null;
  }
  function worldStepIndex(n, pct, mins) {
    if (!mins) { return Math.min(n - 1, Math.floor(pct * n / 100)); }
    var left = pct / 100 * mins.reduce(function (a, b) { return a + b; }, 0);
    for (var i = 0; i < mins.length; i++) { left -= mins[i]; if (left < 0) { return i; } }
    return n - 1;
  }
  // 正在做的那段此刻做到哪：整段几成、正在做哪一步、这一步做到几成（分步的起止按分钟比例摊在整段上，没分钟按步数平分，
  // 和 worldStepIndex 同一个算法）；顺带把分步标上做完 / 正在做，把「还剩几分钟」写进「进行中」那个标签。没写结束的 pct 是 null
  function worldGoing(row, now) {
    var a = +row.getAttribute("data-a"), b = +row.getAttribute("data-b");
    var out = { pct: null, li: null, frac: 1 };
    if (!(a > 0 && b > a)) { return out; }
    out.pct = Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
    out.frac = out.pct / 100;
    var list = row.querySelector(".wsteps");
    if (list && list.children.length) {
      var n = list.children.length, dm = list.getAttribute("data-m"), mins = dm ? dm.split(",").map(Number) : null;
      var at = worldStepIndex(n, out.pct, mins);
      Array.prototype.forEach.call(list.children, function (li, i) { li.className = i < at ? "done" : i === at ? "now" : ""; });
      var total = mins ? mins.reduce(function (x, y) { return x + y; }, 0) : n;
      var done = mins ? mins.slice(0, at).reduce(function (x, y) { return x + y; }, 0) : at;
      var s0 = a + (b - a) * done / total, s1 = a + (b - a) * (done + (mins ? mins[at] : 1)) / total;
      out.li = list.children[at];
      out.frac = s1 > s0 ? Math.max(0, Math.min(1, (now - s0) / (s1 - s0))) : 1;
    }

    if (tag) {
      var m = Math.ceil((b - now) / 60000);

  // 「现在」那个点放到这一段的哪儿：正在做的跟着正在做的那一步（这一步做到几成，就从它第一行往最后一行走几成）；

  function worldNowPlace(row, now) {

  // 每秒走一次：正在做的那几段标分步、写还剩多少；「现在」的点挪到位；一天条带上的那根线也挪。返回正在做的有没有到点

  // 分步：一行一步，做什么和几分钟分开填；回车加下一步，空的那步按退格删掉。上面一行现算一共几分钟、和这段对不对得上

  /* ---------- 世界线一段动了家里哪些吃的：用掉 / 吃了家里有的，做好 / 买回来新的 ---------- */

  var WT_NEW = ["买回来", "收到", "做好了"];

  function wtInfo(f, id) {

  // 能挑来用掉、吃掉、当用料的：这一段新添的、家里现在有的、未来里要添的（这一段开始前就添上的才列；start 认不出就都列）
  function wtStock(f, start) {

    (f.things || []).forEach(function (t) {

        add({ id: t["new"], label: /^n\d+$/.test(t["new"]) ? "新" : t["new"], name: t.name || "（还没起名）", sub: "这一段" + (t.what === "做好了" ? "做好的" : t.what + "的") });
      }

    ((S.things && S.things.items) || []).forEach(function (x) {
      if (!x.ended) { add({ id: x.id, name: x.name, sub: [x.kind, String(x.left || "").replace(/，快用完了$/, "")].filter(Boolean).join(" · ") }); }
    });
    ((S.things && S.things.future) || []).forEach(function (x) {
      var at = String((x.made || {}).end || (x.made || {}).start || "").slice(0, 16);
      if (x.cat === "food" && (!start || !at || at <= start)) { add({ id: x.id, name: x.name, sub: "未来 · " + futureVerb(x) + " " + futureWhen(x) }); }

  // 收着时那一句后面的：多少、用料几样、挪到哪
  function wtSum(t) {
    var bits = [];

      if (t.amount || t.left) { bits.push(t.amount || t.left); }
      if ((t.from || []).length) { bits.push("用料 " + t.from.length + " 样"); }
    } else {
      var end = S.things && S.things.steps.end.indexOf(t.what) >= 0;
      if (t.used) { bits.push("用了 " + t.used); }
      if (t.amount) { bits.push("清点出 " + t.amount); }
      if (t.left && !end) { bits.push((/^还?剩/.test(t.left) ? "" : "剩") + t.left); }
      if (t.place) { bits.push((t.what === "挪地方" ? "挪到 " : "在 ") + t.place); }

  // 「现在」的点和分步在前端自己走（每秒算一次，不请求服务器）。只有两种时候重读一次：
  // 正在做的那段到点了（下一段该接上了），或者过了「下次补写」的时刻（新的段写好了）
  setInterval(function () {

    var now = worldNowMs();
    var done = worldTick(now);
    var next = worldMs((S.world.status || {}).next_step);
    var stepDue = next !== null && now > next + 90000 && S.worldLoadedAt + (S.worldOffset || 0) < next + 90000;
    var quiet = Date.now() - (S.worldLoadedAt || 0) > 60000;

  }, 1000);

  // 打开运行状态时它在最上面，回到顶上去看；收起时原地不动

  /* ================= 家里的吃的 ================= */
  // 存货只有记录员写（聊天里说的）；补写在世界线每段上标的，做完了就现算进来。
  // 编号由程序发、改不了；这里什么都不真删：某一步作废是挪到「作废的」里留着，整件记错了是加一步「记错了」。
  var THING_TONE = { "还新鲜": "ok", "还行": "acc", "快不行了": "warn", "坏了": "bad", "活养着": "acc" };
  var THING_RANK = { "坏了": 0, "快不行了": 1, "还行": 2, "还新鲜": 3, "活养着": 4 };

  function thingTone(it) { return it.ended ? "gone" : (THING_TONE[(it.fresh || {}).level] || "ok"); }
  // 排在前面的：坏了 > 快不行了、余量不多 > 还行 > 还新鲜 > 活养着；没了的最后
  function thingRank(it) {
    if (it.ended) { return 9; }
    var r = THING_RANK[(it.fresh || {}).level];
    if (r === undefined) { r = 3; }
    return it.low ? Math.min(r, 1) : r;
  }
  // 左边那个点：新鲜度和余量里更要紧的那个
  function thingDot(it) {
    var tone = thingTone(it);
    return it.low && (tone === "ok" || tone === "acc") ? "warn" : tone;
  }
  // 一根条：左边名字，中间条（share 是 0–1，null = 说不准，画成斜纹），右边字
  function thingGauge(label, share, tone, text, title) {
    var known = share !== null && share !== undefined;
    return h("div", { class: "tgauge " + tone },
      h("span", { class: "tg-l", text: label }),
      h("span", { class: "tg-t" + (known ? "" : " unk"), title: title || null },
        known ? h("i", { style: "width:" + (Math.max(0, Math.min(1, share)) * 100).toFixed(1) + "%" }) : null),
      h("span", { class: "tg-x", text: text }));
  }
  // 三根条：保鲜（还能放多久，越放越短）、余量（还剩一开始的几成，越吃越短）、口感（还剩几成，毛病越多越短）
  function thingGauges(it) {
    var f = it.fresh || {}, live = f.level === "活养着";
    var keep = live ? 1 : Math.max(0, 1 - (+f.x || 0));
    var left = String(it.left || "");
    var m = it.measured;
    return h("div", { class: "tgauges" },
      thingGauge("保鲜", keep, live ? "acc" : thingTone(it), f.text || "",
        live ? "活养着，不算放了多久" : "已经放了相当于能放多久的 " + Math.round((+f.x || 0) * 100) + "%"),
      thingGauge("余量", it.share, it.low ? "warn" : "acc", left,
        it.share === null || it.share === undefined ? "吃过、用过，没说剩多少"
          : (m ? "对着" + (m.pack ? "一包 " + m.pack + " " + m.unit + "（买来不止一包就对着买来的那么多）" : "买来的那么多") : "对着一开始的那么多")
            + "还剩 " + Math.round(it.share * 100) + "%"),

  // 口感（跟坏没坏分开算）：条是还剩几成，颜色看最要紧的那样（有毒红、很的橙、有点的蓝、没毛病绿）；
  // 右边写有哪几样：毛病在前，有法子缓回来的写在括号里，腌晒熏到哪了、变好了的在后
  var TEXTURE_RANK = { ok: 0, acc: 1, warn: 2, bad: 3 };
  function thingTexture(it) {
    if (it.texture === null || it.texture === undefined) { return null; }
    var rows = it.quality || [], tone = "ok";
    rows.forEach(function (q) {
      var t = q.danger ? "bad" : q.level >= 2 ? "warn" : q.level === 1 ? "acc" : "ok";
      if (TEXTURE_RANK[t] > TEXTURE_RANK[tone]) { tone = t; }
    });
    var text = rows.map(function (q) { return q.text + (q.fix && (q.level >= 1 || q.danger) ? "（" + q.fix + "）" : ""); }).join("；");
    return thingGauge("口感", it.texture, tone, text || "没什么变化", "跟刚有的时候比，口感还剩 " + Math.round(it.texture * 100) + "%");
  }
  function thingFind(id) {
    return ((S.things && S.things.items) || []).filter(function (x) { return x.id === id; })[0] || null;

  /* ---------- 重画时保住位置 ---------- */

  // 重画前记下视口里最上面那一件在哪，重画后放回原来的高度；列表变了找不到它，就停在原来的滚动位置；停在最顶上不记
  function thingsAnchor() {

  // 只换这一件那一行（展开 / 收起每一步、看作废的几步）：别的不动，页面不跳；收起后行头翻到上面去了就带回来
  function thingRedraw(id) {

    Array.prototype.forEach.call(row.querySelectorAll("textarea[data-fit]"), worldFit);
    if (Math.abs(sc.scrollTop - y) > 1) { sc.scrollTop = y; }
    var top0 = sc.getBoundingClientRect().top, r = row.getBoundingClientRect();
    if (r.top < top0) { sc.scrollTop += r.top - top0 - 8; }

  /* ---------- 整页 ---------- */

  // ---------- 筛选与排序（吃的、东西两页共用） ----------
  // 「什么时候」（看哪张单子）在标题旁边，点一下就切，还是 thingsFilter / objFilter；
  // 筛选面板里是排序、在哪、状态（只有吃的）、类别，在 S.tPick。
  // 在哪：here = 此刻住的这一处 + 带在身上的；带在身上 / 某一处 / all。没分过两处（homes 空）不显示这一组
  var T_WHENS = [["now", "现有的"], ["future", "未来"], ["gone", "没了的"], ["all", "全部"]];
  var T_STATES = [["", "全部"], ["hurry", "快不行了"], ["bad", "按时间算坏了"], ["low", "余量不多"]];
  // 排序默认新到旧（按记下来的先后）；原来的默认还能选：吃的「要紧的在前」、东西「长得像的排一起」
  var T_SORTS = { food: [["new", "新到旧"], ["old", "旧到新"], ["urgent", "要紧的在前"], ["name", "按名字"]],
    item: [["new", "新到旧"], ["old", "旧到新"], ["group", "长得像的排一起"], ["name", "按名字"], ["touched", "最近动过的在前"]] };
  function tDefaultPick() { return { where: "here", state: "", kind: "", sort: "new" }; }
  function tPick(objectMode) { return S.tPick[objectMode ? "item" : "food"]; }
  function tKindOf(x, objectMode) { return objectMode ? objKind(x) : (x.kind || ""); }
  function tPassWhere(x, where) {
    var d = S.things || {};
    if (!(d.homes || []).length || !where || where === "all") { return true; }
    var w = x.where || "";
    if (where === "here") { return w === "带在身上" || w === (d.home || ""); }
    return w === where;
  }
  function tPassState(x, state) {
    if (!state) { return true; }
    var level = (x.fresh || {}).level;
    if (state === "hurry") { return !x.ended && level === "快不行了"; }
    if (state === "bad") { return !x.ended && level === "坏了"; }
    if (state === "low") { return !x.ended && !!x.low; }
    return true;
  }
  // 除了 skip 那一组，别的都照现在选的筛（给每组的选项数个数用）
  function tPassAll(x, objectMode, skip) {
    var p = tPick(objectMode), filter = objectMode ? S.objFilter : S.thingsFilter;
    if (skip !== "when" && ((filter === "now" && x.ended) || (filter === "gone" && !x.ended))) { return false; }
    if (skip !== "where" && !tPassWhere(x, p.where)) { return false; }
    if (!objectMode && skip !== "state" && !tPassState(x, p.state)) { return false; }
    if (skip !== "kind" && p.kind && tKindOf(x, objectMode) !== p.kind) { return false; }
    return true;
  }
  function tLastAt(x) {
    var st = (x.stages || [])[(x.stages || []).length - 1];
    return String((x.ended && x.ended.at) || (st && st.at) || x.created || "");
  }
  // 编号里的数（w12 → 12）：同一分钟记下的几件按它分先后
  function tNum(x) { var m = /(\d+)/.exec(String(x.id || "")); return m ? +m[1] : 0; }
  function tSort(list, objectMode) {
    var s = tPick(objectMode).sort;
    if (s === "new") { list.sort(function (a, b) { return String(b.created).localeCompare(String(a.created)) || tNum(b) - tNum(a); }); }
    else if (s === "old") { list.sort(function (a, b) { return String(a.created).localeCompare(String(b.created)) || tNum(a) - tNum(b); }); }
    else if (s === "name") { list.sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || ""), "zh"); }); }
    else if (s === "touched") { list.sort(function (a, b) { return tLastAt(b).localeCompare(tLastAt(a)); }); }
    return list;
  }
  // 「在哪」那组显示的字
  function tWhereLabel(v) {
    var d = S.things || {};
    if (v === "here") { return "这一处" + (d.home ? "（" + d.home + "）" : ""); }
    return v === "all" ? "全部" : v;
  }
  // 改了一组：重画（列表、按钮上的数、面板都跟着变）。换了一张单子（什么时候）就回到最上面
  function tSet(objectMode, key, value) {
    if (key === "when") {
      if (objectMode) { S.objFilter = value; } else { S.thingsFilter = value; }
      renderDataPage({ toTop: true });
      return;
    }
    tPick(objectMode)[key] = value;
    renderDataPage();
  }
  // 跳过来找某一件：这几组要是会把它藏起来，先放开（在哪、状态、类别回到全部）
  function tReveal(objectMode, x) {
    if (!x) { return; }
    var p = tPick(objectMode);
    if (!tPassWhere(x, p.where)) { p.where = "all"; }
    if (!objectMode && !tPassState(x, p.state)) { p.state = ""; }
    if (p.kind && tKindOf(x, objectMode) !== p.kind) { p.kind = ""; }
  }
  // 筛选面板里跟默认不一样的那几组（按钮上的数、收起时按钮下面那一串可点掉的小标签）。「什么时候」在标题旁边，不算在这里
  function tPicked(objectMode) {
    var p = tPick(objectMode), d = S.things || {}, out = [];
    var lab = function (rows, v) { return (rows.filter(function (x) { return x[0] === v; })[0] || [0, v])[1]; };
    if (p.sort !== "new") { out.push({ key: "sort", label: "排序：" + lab(T_SORTS[objectMode ? "item" : "food"], p.sort), reset: "new" }); }
    if ((d.homes || []).length && p.where !== "here") { out.push({ key: "where", label: "在哪：" + tWhereLabel(p.where), reset: "here" }); }
    if (!objectMode && p.state) { out.push({ key: "state", label: lab(T_STATES, p.state), reset: "" }); }
    if (p.kind) { out.push({ key: "kind", label: "类别：" + p.kind, reset: "" }); }
    return out;
  }
  // 标题旁边「现有的 / 未来 / 没了的 / 全部」：看哪张单子，点一下就切。件数照筛选面板里选的算（未来那张单子不分这些）
  function tWhenSeg(objectMode, items) {
    var seg = clear($("thingsWhen"));
    if (!items) { return; }
    var filter = objectMode ? S.objFilter : S.thingsFilter;
    var pass = items.filter(function (x) { return tPassAll(x, objectMode, "when"); });
    var counts = { now: pass.filter(function (x) { return !x.ended; }).length, gone: pass.filter(function (x) { return !!x.ended; }).length,
      all: pass.length, future: futureList(objectMode ? "item" : "food", "").length };
    T_WHENS.forEach(function (o) {
      seg.appendChild(h("button", { type: "button", class: o[0] === filter ? "on" : "", "aria-pressed": o[0] === filter ? "true" : "false",
        onclick: function () { if (o[0] !== (objectMode ? S.objFilter : S.thingsFilter)) { tSet(objectMode, "when", o[0]); } } },
        o[1], h("span", { class: "wcount", text: String(counts[o[0]]) })));
    });
  }
  // 搜的字对得上哪些（名字、编号、种类、哪来的、搁在哪……）
  function tMatch(x, q, objectMode) {
    if (!q) { return true; }
    var fields = objectMode
      ? [x.id, x.name, x.kind, x.look, x.inside, x.origin, x.place, x.holder_label, x.state, x.owner_label]
      : [x.id, x.name, x.kind, x.origin, x.place];
    return fields.join(" ").toLowerCase().indexOf(q) >= 0;
  }
  // 搜的时候，照现在的条件没列出来、别处还有对得上的：说在哪，点一下全放开一起看
  function tHiddenHint(objectMode, hidden, filter, none) {
    var p = tPick(objectMode), why = {}, order = [];
    hidden.forEach(function (x) {
      var k;
      if (filter === "now" && x.ended) { k = "已经没了"; }
      else if (filter === "gone" && !x.ended) { k = "还在的"; }
      else if (!tPassWhere(x, p.where)) { k = x.where === "带在身上" ? "带在身上" : "在" + (x.where || "别处"); }
      else { k = "被筛选挡住"; }
      if (!why[k]) { why[k] = 0; order.push(k); }
      why[k] += 1;
    });
    var parts = order.map(function (k) { return k + " " + why[k]; }).join(" · ");
    return h("div", { class: none ? "muted" : "thidden", style: none ? "font-size:13px;line-height:1.7" : null },
      (none ? "照现在的条件没有对得上的。别处还有 " : "别处还有 ") + hidden.length + " 件对得上：" + parts,
      h("button", { class: "tlink", type: "button", style: none ? "font-size:13px;margin-left:8px" : null, onclick: function () {
        if (objectMode) { S.objFilter = "all"; } else { S.thingsFilter = "all"; }
        p.where = "all"; p.state = ""; p.kind = "";
        renderDataPage({ toTop: true });

  // 整页重画。opt.toTop：回到最上面（换到吃的 / 东西时）；opt.anchor：放回离开前记下的位置；

  /* ---------- 未来：世界线里还没做完的段要添的（要买回来、要做好的……） ---------- */

  // 改未来里的一件吃的：名字、怎么来的、哪一类、多少、用料；放在哪、放法、状态收在「更多」里

  // 历史：每 4 秒只问一次「最后一条」，变了才整段重读；请求快照：有新快照且正看最新一份时自动换上
  var POLL_MS = 4000, pollBusy = false, pollAgain = false, pollRetryT = null, newCount = 0;
  function nearBottom() {
    var sc = $("histScroll");
    return sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  }
  function showNewPill(n) {
    newCount += n;
    var p = clear($("newPill"));
    p.appendChild(icon("right"));
    p.appendChild(document.createTextNode(newCount + " 条新消息"));
    p.hidden = false;
  }
  function hideNewPill() { newCount = 0; $("newPill").hidden = true; }
  $("newPill").addEventListener("click", function () {
    var sc = $("histScroll");
    sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
    hideNewPill();
  });
  $("histScroll").addEventListener("scroll", function () { if (newCount && nearBottom()) { hideNewPill(); } });

  function pollTick() {
    if (pollBusy) { pollAgain = true; return; }
    if (document.hidden || S.view !== "conv" || !S.cid) { return; }
    var cid = S.cid;
    pollBusy = true;
    api("ctx/pulse", { cid: cid }).then(function (d) {
      if (cid !== S.cid) { return; }
      if (typeof d.conv_sig === "string") {
        if (S.convSig && d.conv_sig !== S.convSig) { loadConvs(); }
        S.convSig = d.conv_sig;
      } else if (d.conversations_changed) {
        loadConvs();
      }
      var sig = d.last && d.last.sig || "";
      if (d.total !== S.total || sig !== S.lastSig) {
        // 历史还在读、还没读过、多选中、详情面板改了没存、弹窗开着：这一轮先不重读（下一轮照样发现）；
        // 推送连着时不会再来一遍，等一会儿自己再看一次
        var busy = S.multi || (S.insp && S.insp.dirty) || !$("modal").hidden;
        if (!busy && !S.histLoading && S.range) {
          return loadHistory("poll", Math.max(0, (d.total || 0) - (S.total || 0)));
        }
        if (busy && LIVE.on) { clearTimeout(pollRetryT); pollRetryT = setTimeout(pollTick, 1500); }
      }
      if (S.tab === "requests" && d.versions && d.versions.requests !== S.requestVersion) { return pollRequests(); }
    }).catch(function () {}).then(function () {
      pollBusy = false;
      if (pollAgain) { pollAgain = false; pollTick(); }
    });
  }

  // 请求快照有新的了：正看最新那份就换成新的（安静重读）；看的是旧的就停着，提示有新快照。
  // 页面上还没有快照（第一次、空的、读错了）就整个重读
  function pollRequests() {
    var c = curConv();
    if (!c || S.req.loading) { return; }
    if (S.req.err || !S.req.list.length) { loadRequests(); return; }
    return api("ctx/requests", { umo: c.umo, limit: 30 }).then(function (d) {
      if (!curConv() || curConv().umo !== c.umo || S.tab !== "requests") { return; }
      S.requestVersion = d && d.version || 0;
      var list = (d && d.items) || [];
      var oldFirst = S.req.list[0] && S.req.list[0].id;
      if (!list.length || list[0].id === oldFirst) { return; }
      var curId = S.req.list[S.req.idx] && S.req.list[S.req.idx].id;
      var following = S.req.idx === 0 || !curId;
      S.req.list = list;
      S.req.disabled = !!d.disabled;
      if (following) { S.req.idx = 0; renderReqBar(); loadSnap(true); }
      else {
        var k = -1;
        list.forEach(function (x, j) { if (x.id === curId) { k = j; } });
        S.req.idx = k >= 0 ? k : 0;
        renderReqBar();
        $("reqHint").textContent += " · 有新快照，点 › 查看";
      }
    });
  }

  // 实时推送连着的时候不轮询，断了才每 4 秒问一次
  setInterval(function () { if (!LIVE.on) { pollTick(); } }, POLL_MS);
  // 切回面板时立刻补一次，不用等下一轮
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { return; }
    if (LIVE.on) { liveFlush(); } else { pollTick(); }
    if (Date.now() - sideAt > 60000) { loadSide(); }
  });
  setInterval(function () {
    if (document.hidden || LIVE.on) { return; }
    // 有正在改的能力 / 在练的事就不重读：整页重画会把输入框重建，打断正在输入的内容
    if (S.view === "ledger" && !ledgerEditing()) { loadLedger(true); }
    if (S.view === "money" && !moneyEditing()) { loadMoney(true); }
    if (S.view === "heat" && !S.heatBusy && !S.heatPop) { loadHeat(true); }
  }, 30000);
  // 热源页温度会随现实时间自然升降，即使 SSE 连通也每分钟静默重算一次
  setInterval(function () {
    if (!document.hidden && S.view === "heat" && !S.heatBusy && !S.heatPop) { loadHeat(true); }
  }, 60000);

  /* ================= 实时推送 ================= */
  // 服务器那头谁写了数据谁喊一声（ctx/stream），这里挂着收，收到只刷新正在看的那一页；
  // 先收到 hello 才算连上，之后 LIVE_DEAD_MS 里一条都没收到（心跳 10 秒一条）就当断了，退回轮询、过一会儿重连
  var LIVE = { on: false, id: null, gen: 0, retry: 0, last: 0, opened: false, timer: null, flushT: null, pending: {}, side: false };
  var LIVE_DEAD_MS = 30000;
  function liveStart() {
    var b = bridge();
    if (!b || typeof b.subscribeSSE !== "function") { return; }
    if (LIVE.id) { try { b.unsubscribeSSE(LIVE.id); } catch (e) { /* 已经断了 */ } LIVE.id = null; }
    var myGen = ++LIVE.gen;
    LIVE.last = Date.now();
    b.subscribeSSE("ctx/stream", {
      onMessage: function (m) { if (myGen === LIVE.gen) { liveGot(m); } },
      onError: function () { if (myGen === LIVE.gen) { liveLost(); } }
    }).then(function (id) {
      if (myGen !== LIVE.gen) {
        if (id) { try { b.unsubscribeSSE(id); } catch (e) { /* 已失效旧订阅 */ } }
        return;
      }
      LIVE.id = id;
    }).catch(function () {
      if (myGen === LIVE.gen) { liveLost(); }
    });
  }
  function liveLost() {
    LIVE.gen++;
    LIVE.on = false;
    if (LIVE.id) { try { bridge().unsubscribeSSE(LIVE.id); } catch (e) { /* 已经断了 */ } LIVE.id = null; }
    if (LIVE.timer) { return; }
    var wait = Math.min(30000, 2000 * Math.pow(2, LIVE.retry++));
    LIVE.timer = setTimeout(function () { LIVE.timer = null; liveStart(); }, wait);
    if (!document.hidden) { pollTick(); }
  }
  function liveGot(m) {
    LIVE.last = Date.now();
    var type = m && m.eventType, data = (m && m.parsed) || {};
    if (type === "hello") {
      LIVE.on = true;
      LIVE.retry = 0;
      if (LIVE.opened) {
        // 断线重连后只补刷当前正在看的视图，避免瞬间打穿一堆接口
        var viewTopic = { conv: "conv", world: "world", things: "things", heat: "things", pool: "pools", ledger: "ledger", money: "money" }[S.view];
        if (viewTopic) { liveRefresh([viewTopic]); }
        else { loadSide(); }
      }
      LIVE.opened = true;
      return;
    }
    if (type !== "change") { return; }
    (data.runs || []).forEach(worldRunDone);
    liveRefresh(data.topics || []);
  }
  setInterval(function () {
    if (LIVE.id && Date.now() - LIVE.last > LIVE_DEAD_MS) { liveLost(); }
  }, 10000);

  function liveRefresh(topics) {
    topics.forEach(function (t) {
      LIVE.pending[t] = true;
      if (t !== "conv" && t !== "requests") { LIVE.side = true; }
    });
    liveFlush();
  }
  // 只刷新正在看的那一页；正忙着读、或者有改了没存的编辑框，过一会儿再试；别的页打开时本来就会重读，记下的直接丢掉
  function liveFlush() {
    clearTimeout(LIVE.flushT);
    if (document.hidden) { return; }
    var p = LIVE.pending, later = false;
    function drop() { Array.prototype.forEach.call(arguments, function (t) { delete p[t]; }); }
    if (p.conv || p.requests) {
      if (S.view !== "conv") { drop("conv", "requests"); }
      else { drop("conv", "requests"); pollTick(); }
    }
    if (p.world || p.things) {
      if (S.view === "world") {
        if (worldEditing() || S.worldLoading) { later = true; } else { drop("world", "things"); loadWorld(true); }
      } else if (S.view === "things") {
        if (thingsEditing() || S.thingsLoading) { later = true; } else { drop("world", "things"); loadThings(true); }
      } else if (S.view === "heat") {
        if (S.heatBusy || S.heatLoading || S.heatPop) { later = true; } else { drop("world", "things"); loadHeat(true); }
      } else { drop("world", "things"); }
    }
    if (p.pools) {
      if (S.view !== "pool") { drop("pools"); } else if (poolEditing() || S.poolsLoading) { later = true; } else { drop("pools"); loadPools(true); }
    }
    if (p.ledger) {
      if (S.view !== "ledger") { drop("ledger"); } else if (ledgerEditing() || S.ledgerLoading) { later = true; } else { drop("ledger"); loadLedger(true); }
    }
    if (p.money) {
      if (S.view !== "money") { drop("money"); } else if (moneyEditing() || S.moneyLoading) { later = true; } else { drop("money"); loadMoney(true); }
    }
    if (p.master_mood) {
      if (S.moodOpen && (S.moodDirty || S.moodSaving)) { later = true; } else { drop("master_mood"); loadMasterMood(true); }
    }
    if (LIVE.side) { LIVE.side = false; loadSide(); }
    if (later) { LIVE.flushT = setTimeout(liveFlush, 1500); }
  }

  /* ================= 世界线内联主人情绪条 ================= */
  var MOOD_OWNER_OPTS = [
    { v: -1, text: "开心", tone: "tone-happy" },
    { v: 0, text: "平常", tone: "" },
    { v: 1, text: "烦累", tone: "tone-lv1" },
    { v: 2, text: "气着", tone: "tone-lv2" },
    { v: 3, text: "崩了", tone: "tone-lv3" }
  ];
  var MOOD_BOT_OPTS = [
    { v: 0, text: "平常", tone: "" },
    { v: 1, text: "微凉", tone: "tone-lv1" },
    { v: 2, text: "生气", tone: "tone-lv2" },
    { v: 3, text: "严重", tone: "tone-lv3" }
  ];

  function moodOwnerWord(level) {
    var lv = Number(level || 0);
    for (var i = 0; i < MOOD_OWNER_OPTS.length; i++) {
      if (MOOD_OWNER_OPTS[i].v === lv) { return MOOD_OWNER_OPTS[i].text; }
    }
    return "平常";
  }

  function moodBotWord(level) {
    var lv = Number(level || 0);
    for (var i = 0; i < MOOD_BOT_OPTS.length; i++) {
      if (MOOD_BOT_OPTS[i].v === lv) { return MOOD_BOT_OPTS[i].text; }
    }
    return "平常";
  }

  function moodShort(text, max) {
    var s = String(text || "").replace(/\s+/g, " ").trim();
    if (!s) { return ""; }
    return s.length > max ? s.slice(0, max) + "…" : s;
  }

  function moodKnownBots(m) {
    var out = [], seen = {};
    function pushBot(key, label) {
      var k = String(key || "").trim();
      if (!k || seen[k]) { return; }
      seen[k] = true;
      out.push({ key: k, label: label || S.labels[k] || k });
    }
    if (m && Array.isArray(m.bots)) {
      m.bots.forEach(function (b) { if (b && b.key) { pushBot(b.key, b.label); } });
    }
    if (m && m.per_bot) {
      Object.keys(m.per_bot).forEach(function (k) {
        var row = m.per_bot[k] || {};
        pushBot(k, row.label);
      });
    }
    Object.keys(S.labels || {}).forEach(function (k) { pushBot(k, S.labels[k]); });
    if (!out.length) {
      pushBot("napcat", "丛雨");
      pushBot("napcat2", "亚托莉");
    }
    return out;
  }

  function moodNorm(raw) {
    var src = raw && typeof raw === "object" ? raw : {};
    var o = src.owner && typeof src.owner === "object" ? src.owner : {};
    var bots = moodKnownBots(src);
    var pb = {};
    bots.forEach(function (b) {
      var r = (src.per_bot && src.per_bot[b.key]) || {};
      pb[b.key] = {
        label: r.label || b.label,
        level: Number(r.level || 0),
        phase: String(r.phase || ""),
        peak: Number(r.peak || 0),
        reason: String(r.reason || ""),
        peer_aware: !!r.peer_aware,
        updated_at: String(r.updated_at || ""),
        code: String(r.code || "")
      };
    });
    return {
      owner: {
        level: Number(o.level || 0),
        phase: String(o.phase || ""),
        peak: Number(o.peak || 0),
        reason: String(o.reason || ""),
        updated_at: String(o.updated_at || ""),
        source: String(o.source || "")
      },
      per_bot: pb,
      incidents: src.incidents && typeof src.incidents === "object" ? src.incidents : {},
      bots: bots
    };
  }

  function moodSummaryInfo(raw) {
    var m = moodNorm(raw);
    var ownerLv = m.owner.level;
    var activeBots = [];
    m.bots.forEach(function (b) {
      var row = m.per_bot[b.key];
      if (row && row.level > 0) {
        activeBots.push({ key: b.key, label: row.label, level: row.level, phase: row.phase, reason: row.reason, peer_aware: row.peer_aware, updated_at: row.updated_at });
      }
    });
    activeBots.sort(function (a, b) { return b.level - a.level; });

    var incKeys = Object.keys(m.incidents || {}).filter(function (k) { return m.incidents[k]; });
    var maxPos = Math.max(ownerLv > 0 ? ownerLv : 0, activeBots.length ? activeBots[0].level : 0);
    var hasNonZero = ownerLv !== 0 || activeBots.length > 0;
    var tone = "calm";
    if (maxPos >= 3) { tone = "lv3"; }
    else if (maxPos === 2) { tone = "lv2"; }
    else if (maxPos === 1) { tone = "lv1"; }
    else if (ownerLv === -1) { tone = "happy"; }

    var parts = [];
    activeBots.forEach(function (b) {
      var w = moodBotWord(b.level);
      parts.push("对" + b.label + w + (b.phase === "easing" ? "（缓和中）" : ""));
    });
    if (ownerLv > 0) {
      parts.push("自己" + moodOwnerWord(ownerLv) + (m.owner.phase === "easing" ? "（缓和中）" : ""));
    } else if (ownerLv === -1) {
      parts.push("开心");
    }

    var text = "平常";
    if (hasNonZero) {
      if (parts.length === 1) {
        var singleReason = activeBots.length === 1 ? activeBots[0].reason : m.owner.reason;
        var sr = moodShort(singleReason, 14);
        text = parts[0] + (sr ? " · " + sr : "");
      } else {
        text = parts.join(" / ");
      }
    } else if (incKeys.length) {
      text = "平常 · 刚翻篇";
    }
    return { text: text, tone: tone, hasNonZero: hasNonZero, norm: m, incKeys: incKeys };
  }

  function cloneMoodDraft(raw) {
    var m = moodNorm(raw);
    var pb = {};
    m.bots.forEach(function (b) {
      var r = m.per_bot[b.key] || {};
      pb[b.key] = {
        label: r.label || b.label,
        level: Number(r.level || 0),
        phase: String(r.phase || ""),
        reason: String(r.reason || ""),
        peer_aware: !!r.peer_aware,
        updated_at: String(r.updated_at || "")
      };
    });
    return {
      owner: {
        level: Number(m.owner.level || 0),
        phase: String(m.owner.phase || ""),
        reason: String(m.owner.reason || ""),
        updated_at: String(m.owner.updated_at || "")
      },
      per_bot: pb,
      bots: m.bots,
      incidents: m.incidents || {}
    };
  }

  function setMasterMood(raw) {
    if (!raw || typeof raw !== "object") { return; }
    var sig = JSON.stringify(moodNorm(raw));
    if (sig === S.moodSig) { return; }
    S.moodSig = sig;
    S.masterMood = raw;
    if (S.moodOpen && !S.moodDirty && !S.moodSaving) {
      S.moodDraft = cloneMoodDraft(raw);
    }
    renderWorldMood();
  }

  function loadMasterMood(silent) {
    return api("ctx/master_mood").then(function (d) {
      if (d) { setMasterMood(d); }
    }).catch(function (e) {
      if (!silent) { toast("读取主人情绪失败：" + errMsg(e), { err: true }); }
    });
  }

  function toggleWorldMood(open) {
    var next = typeof open === "boolean" ? open : !S.moodOpen;
    if (next) {
      S.moodOpen = true;
      S.moodDirty = false;
      S.moodSaving = false;
      S.moodDraft = cloneMoodDraft(S.masterMood);
      renderWorldMood();
      loadMasterMood(true);
    } else {
      S.moodOpen = false;
      S.moodDraft = null;
      S.moodDirty = false;
      S.moodSaving = false;
      renderWorldMood();
    }
  }

  function saveWorldMood(isReset) {
    if (S.moodSaving) { return; }
    var body;
    if (isReset) {
      body = { action: "reset" };
    } else {
      var d = S.moodDraft;
      if (!d) { return; }
      var pb = {};
      d.bots.forEach(function (b) {
        var r = d.per_bot[b.key] || {};
        pb[b.key] = {
          level: Number(r.level || 0),
          reason: String(r.reason || "").trim(),
          peer_aware: !!r.peer_aware
        };
      });
      body = {
        owner: { level: Number(d.owner.level || 0), reason: String(d.owner.reason || "").trim() },
        per_bot: pb
      };
    }
    S.moodSaving = true;
    renderWorldMood();
    post("ctx/master_mood", body).then(function (res) {
      S.moodSaving = false;
      if (res) { S.masterMood = res; S.moodSig = JSON.stringify(moodNorm(res)); }
      S.moodOpen = false;
      S.moodDraft = null;
      S.moodDirty = false;
      renderWorldMood();
      toast(isReset ? "已恢复平常" : "已保存");
      if (S.view === "world" && !worldEditing()) { loadWorld(true); }
    }).catch(function (e) {
      S.moodSaving = false;
      renderWorldMood();
      toast("保存失败：" + errMsg(e), { err: true });
    });
  }

  function renderWorldMood(hostEl) {
    var host = hostEl || $("worldMoodHost");
    if (!host) { return; }
    var info = moodSummaryInfo(S.masterMood);
    clear(host);

    var quickReset = (!S.moodOpen && info.hasNonZero) ? h("button", {
      class: "btn quiet sm",
      type: "button",
      disabled: S.moodSaving,
      text: "恢复平常",
      onclick: function (ev) { ev.stopPropagation(); saveWorldMood(true); }
    }) : null;

    var head = h("div", {
      class: "wmood-head",
      role: "button",
      tabindex: "0",
      "aria-expanded": S.moodOpen ? "true" : "false",
      onclick: function () { if (!S.moodSaving) { toggleWorldMood(); } },
      onkeydown: function (ev) {
        if ((ev.key === "Enter" || ev.key === " ") && !S.moodSaving) {
          ev.preventDefault();
          toggleWorldMood();
        }
      }
    },
      h("span", { class: "wmood-dot", "aria-hidden": "true" }),
      h("span", { class: "wmood-k", text: "主人情绪" }),
      h("span", { class: "wmood-v", text: info.text }),
      h("div", { class: "wmood-head-acts" },
        quickReset,
        h("span", { class: "wmood-chev", "aria-hidden": "true", text: "▾" })
      )
    );

    var box = h("div", { class: "wmood-box tone-" + info.tone + (S.moodOpen ? " open" : "") }, head);

    if (S.moodOpen) {
      var d = S.moodDraft || cloneMoodDraft(S.masterMood);
      S.moodDraft = d;
      var curNorm = info.norm;
      var pane = h("div", { class: "wmood-pane" });

      var ownerSeg = h("div", { class: "seg wmood-seg" });
      MOOD_OWNER_OPTS.forEach(function (opt) {
        var on = d.owner.level === opt.v;
        ownerSeg.appendChild(h("button", {
          type: "button",
          class: on ? ("on" + (opt.tone ? " " + opt.tone : "")) : "",
          disabled: S.moodSaving,
          text: opt.text,
          onclick: function () {
            if (d.owner.level === opt.v) { return; }
            d.owner.level = opt.v;
            if (opt.v === 0) { d.owner.reason = ""; }
            S.moodDirty = true;
            renderWorldMood();
          }
        }));
      });
      var ownerMeta = curNorm.owner.level !== 0
        ? (curNorm.owner.phase === "easing" ? "缓和中" : (curNorm.owner.updated_at ? curNorm.owner.updated_at.slice(5, 16) : ""))
        : "";
      var ownerRow = h("div", { class: "wmood-row" },
        h("div", { class: "wmood-row-h" },
          h("span", { class: "wmood-row-t", text: "我自己" }),
          ownerMeta ? h("span", { class: "wmood-row-m", text: ownerMeta }) : null
        ),
        ownerSeg
      );
      if (d.owner.level !== 0) {
        ownerRow.appendChild(h("div", { class: "wmood-extra" },
          h("input", {
            class: "inp",
            type: "text",
            placeholder: "起因（可选）",
            value: d.owner.reason,
            disabled: S.moodSaving,
            oninput: function (ev) { d.owner.reason = ev.target.value; S.moodDirty = true; }
          })
        ));
      }
      pane.appendChild(ownerRow);

      d.bots.forEach(function (b) {
        var row = d.per_bot[b.key];
        if (!row) { return; }
        var seg = h("div", { class: "seg wmood-seg" });
        MOOD_BOT_OPTS.forEach(function (opt) {
          var on = row.level === opt.v;
          seg.appendChild(h("button", {
            type: "button",
            class: on ? ("on" + (opt.tone ? " " + opt.tone : "")) : "",
            disabled: S.moodSaving,
            text: opt.text,
            onclick: function () {
              if (row.level === opt.v) { return; }
              row.level = opt.v;
              if (opt.v === 0) { row.reason = ""; row.peer_aware = false; }
              S.moodDirty = true;
              renderWorldMood();
            }
          }));
        });
        var curBot = (curNorm.per_bot && curNorm.per_bot[b.key]) || {};
        var meta = curBot.level > 0
          ? (curBot.phase === "easing" ? "缓和中" : (curBot.updated_at ? curBot.updated_at.slice(5, 16) : ""))
          : "";
        var botRow = h("div", { class: "wmood-row" },
          h("div", { class: "wmood-row-h" },
            h("span", { class: "wmood-row-t", text: "对" + row.label }),
            meta ? h("span", { class: "wmood-row-m", text: meta }) : null
          ),
          seg
        );
        if (row.level > 0) {
          botRow.appendChild(h("div", { class: "wmood-extra" },
            h("input", {
              class: "inp",
              type: "text",
              placeholder: "起因（可选）",
              value: row.reason,
              disabled: S.moodSaving,
              oninput: function (ev) { row.reason = ev.target.value; S.moodDirty = true; }
            }),
            h("label", { class: "wmood-chk" },
              h("input", {
                type: "checkbox",
                checked: !!row.peer_aware,
                disabled: S.moodSaving,
                onchange: function (ev) { row.peer_aware = !!ev.target.checked; S.moodDirty = true; }
              }),
              h("span", { text: "另一人知情" })
            )
          ));
        }
        pane.appendChild(botRow);
      });

      var incKeys = Object.keys(d.incidents || {}).filter(function (k) { return d.incidents[k]; });
      if (incKeys.length) {
        var incParts = incKeys.map(function (k) {
          var inc = d.incidents[k] || {};
          var lbl = (d.per_bot[k] && d.per_bot[k].label) || S.labels[k] || k;
          return lbl + (inc.reason ? "（" + inc.reason + "）" : "");
        });
        pane.appendChild(h("div", { class: "wmood-inc", text: "刚翻篇余波：" + incParts.join("、") }));
      }

      var hasDraftNonZero = d.owner.level !== 0 || d.bots.some(function (b) { return (d.per_bot[b.key] || {}).level > 0; });
      pane.appendChild(h("div", { class: "wmood-foot" },
        (info.hasNonZero || hasDraftNonZero) ? h("button", {
          class: "btn quiet sm",
          type: "button",
          disabled: S.moodSaving,
          text: "恢复平常",
          onclick: function () { saveWorldMood(true); }
        }) : null,
        h("div", { class: "wmood-foot-r" },
          h("button", { class: "btn quiet sm", type: "button", disabled: S.moodSaving, text: "收起", onclick: function () { toggleWorldMood(false); } }),
          h("button", { class: "btn pri sm", type: "button", disabled: S.moodSaving || !S.moodDirty, text: S.moodSaving ? "保存中…" : "保存", onclick: function () { saveWorldMood(false); } })
        )
      ));

      box.appendChild(pane);
    }

    host.appendChild(box);
  }


  /* ================= 启动 ================= */
  // 会话列表：按最近更新排好存起来（首屏和刷新会话列表共用）
  function setConvs(d) {
    var list = (d && d.conversations) || [];
    list.sort(function (a, b) { return (b.updated_at || 0) - (a.updated_at || 0); });
    S.convs = list;
    S.convErr = "";
    if (d && typeof d.conv_sig === "string") { S.convSig = d.conv_sig; }
    return list;
  }
  function loadConvs() {
    return api("ctx/conversations").then(function (d) {
      setConvs(d);
      renderSide();
      if (S.view === "conv") { renderHead(); }
    }).catch(function (e) {
      S.convErr = errMsg(e);
      renderSide();
    });
  }

  // 侧栏那几项的小字（不打开那一页也显示个数）：首屏画完后取一次，切回页面时超过一分钟再取；在途去重 + 5 秒防抖
  var sideAt = 0, sideFlight = null;
  function loadSide(force) {
    if (sideFlight) { return sideFlight; }
    if (!force && sideAt && Date.now() - sideAt < 5000) { return Promise.resolve(); }
    sideAt = Date.now();
    sideFlight = api("ctx/side").then(function (d) {
      sideAt = Date.now();
      S.side = d || {};
      if (S.side.master_mood) { setMasterMood(S.side.master_mood); }
      renderSide();
    }).catch(function () { /* 小字取不到就先显示读取中 */ }).then(function () {
      sideFlight = null;
    });
    return sideFlight;
  }

  function start() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function (el) {
      el.insertBefore(icon(el.getAttribute("data-icon")), el.firstChild);
    });
    var b = bridge();
    Promise.resolve(typeof b.ready === "function" ? b.ready() : null).catch(function () {}).then(function () {
      return api("ctx/boot");
    }).then(function (d) {
      var list = setConvs(d);
      S.labels = {};
      (d.bots || []).forEach(function (x) { S.labels[x.id] = x.label; });
      if (d && d.master_mood) { setMasterMood(d.master_mood); } else { renderWorldMood(); }
      renderSide();
      showView();
      liveStart();
      if (!list.length) { renderStream(); return; }
      var saved = store.get("cid", "");
      var has = list.some(function (c) { return c.cid === saved; });
      var cid = has ? saved : list[0].cid;
      selectConv(cid, cid === list[0].cid ? d.history : null);
      loadSide();
    }).catch(function (e) {
      toast("初始化失败：" + errMsg(e), { err: true });
    });
  }

  // 桥接脚本由面板注入，可能晚于本脚本执行：轮询等待，最多约 6 秒。
  function waitBridge(tries) {
    if (window.AstrBotPluginPage) { start(); return; }
    if (tries >= 120) {
      var box = clear($("stream"));
      box.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "页面桥接未就绪" }), h("div", { text: "请刷新一次页面；若仍如此，说明面板版本不支持插件页面。" })));
      return;
    }
    setTimeout(function () { waitBridge(tries + 1); }, 50);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { waitBridge(0); });
  } else {
    waitBridge(0);
  }
})();
</script>
</body>
</html>
