  // 进度条在前端自己走（每秒算一次，不请求服务器）。只有两种时候重读一次：
  // 正在做的那段到 100% 了（下一段该接上了），或者过了「下次补写」的时刻（新的段写好了）
  setInterval(function () {
    if (S.view !== "world" || document.hidden || !S.world) { return; }
    var now = worldNowMs(), done = false;
    Array.prototype.forEach.call(document.querySelectorAll("#worldBody .wprog"), function (el) {
      var pct = worldProg(el, now);
      if (pct === null) { return; }
      var list = el.parentNode.querySelector(".wsteps");
      if (list) {
        var dm = list.getAttribute("data-m");
        var at = worldStepIndex(list.children.length, pct, dm ? dm.split(",").map(Number) : null);
        Array.prototype.forEach.call(list.children, function (li, i) { li.className = i < at ? "done" : i === at ? "now" : ""; });
      }
      if (pct >= 100) { done = true; }
    });
    var next = worldMs((S.world.status || {}).next_step);
    var stepDue = next !== null && now > next + 90000 && S.worldLoadedAt + (S.worldOffset || 0) < next + 90000;
    var quiet = Date.now() - (S.worldLoadedAt || 0) > 60000;
    if ((done || stepDue) && quiet && !worldEditing() && !S.worldBusy && !S.worldLoading) { loadWorld(true); }
  }, 1000);

  /* ================= 抽屉 ================= */
  function openDrawer(title, sub, build) {
    var dr = clear($("drawer"));
    dr.appendChild(panelHead(h("span"), title, sub, closeDrawer));
    var body = h("div", { class: "pb scroll" });
    build(body);
    dr.appendChild(body);
    dr.hidden = false;
    S.drawer = true;
    syncScrim();
  }
  function closeDrawer() {
    $("drawer").hidden = true;
    clear($("drawer"));
    S.drawer = false;
    syncScrim();
  }

  /* ================= 全局按键 ================= */
  document.addEventListener("keydown", function (ev) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target && ev.target.tagName) || "");
    if (!$("modal").hidden) {
      if (ev.key === "Escape" && modalDone) { modalDone(false); }
      return;
    }
    if (ev.key === "Escape") {
      if (S.drawer) { closeDrawer(); return; }
      if (S.insp) { closeInsp(); return; }
      if (S.multi) { setMulti(false); return; }
      if ($("app").classList.contains("side-open")) { setSideOpen(false); }
      return;
    }
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && S.insp) {
      var btn = $("insp").querySelector(".pf .btn.pri");
      if (btn && !btn.disabled) { ev.preventDefault(); btn.click(); }
      return;
    }
    if (typing) { return; }
    if (ev.key === "/" && S.view === "conv" && S.tab === "history") { ev.preventDefault(); $("q").focus(); }
  });
  window.addEventListener("resize", syncScrim);

  $("refreshBtn").addEventListener("click", function () {
    loadConvs();
    // loadScene(true);
    if (S.tab === "history") { loadHistory(S.items.length ? "keep" : "fresh"); } else { loadRequests(); }
  });

  /* ================= 自动刷新 ================= */
  // 历史：每 4 秒只问一次「最后一条」，变了才整段重读；请求快照：有新快照且正看最新一份时自动换上
  var POLL_MS = 4000, pollBusy = false, newCount = 0;
  function nearBottom() {
    var sc = $("histScroll");
    return sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  }
  function showNewPill(n) {
    newCount += n;
    var p = clear($("newPill"));
    p.appendChild(icon("right"));
    p.appendChild(document.createTextNode(newCount + " 条新消息"));
    p.hidden = false;
  }
  function hideNewPill() { newCount = 0; $("newPill").hidden = true; }
  $("newPill").addEventListener("click", function () {
    var sc = $("histScroll");
    sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
    hideNewPill();
  });
  $("histScroll").addEventListener("scroll", function () { if (newCount && nearBottom()) { hideNewPill(); } });

  function pollHistory() {
    if (S.histLoading || !S.range || S.multi || (S.insp && S.insp.dirty) || !$("modal").hidden) { return; }
    var cid = S.cid;
    pollBusy = true;
    api("ctx/history", { cid: cid, limit: 1 }).then(function (d) {
      if (cid !== S.cid || !S.range || S.histLoading) { return; }
      var last = S.items[S.items.length - 1], nl = ((d && d.items) || [])[0];
      var same = d.total === S.range.total && !nl === !last &&
        (!nl || (nl.i === last.i && nl.text === last.text && nl.think === last.think && nl.chars === last.chars));
      if (same) { return; }
      return loadHistory("poll", d.total - S.range.total);
    }).catch(function () { /* 自动刷新失败不打扰，下一轮再试 */ }).then(function () { pollBusy = false; });
  }

  function pollRequests() {
    var c = curConv();
    if (!c || S.req.loading || S.req.err) { return; }
    pollBusy = true;
    api("ctx/requests", { umo: c.umo, limit: 30 }).then(function (d) {
      if (!curConv() || curConv().umo !== c.umo || S.tab !== "requests") { return; }
      var list = (d && d.items) || [];
      var oldFirst = S.req.list[0] && S.req.list[0].id;
      if (!list.length || list[0].id === oldFirst) { return; }
      var curId = S.req.list[S.req.idx] && S.req.list[S.req.idx].id;
      var following = S.req.idx === 0 || !curId;
      S.req.list = list;
      S.req.disabled = !!d.disabled;
      delete toolCache[c.umo];
      if (following) { S.req.idx = 0; renderReqBar(); loadSnap(true); }
      else {
        var k = -1;
        list.forEach(function (x, j) { if (x.id === curId) { k = j; } });
        S.req.idx = k >= 0 ? k : 0;
        renderReqBar();
        $("reqHint").textContent += " · 有新快照，点 › 查看";
      }
    }).catch(function () {}).then(function () { pollBusy = false; });
  }

  function pollTick() {
    if (pollBusy || document.hidden || S.view !== "conv" || !S.cid) { return; }
    if (S.tab === "history") { pollHistory(); } else { pollRequests(); }
  }
  setInterval(pollTick, POLL_MS);
  // 切回面板时立刻补一次，不用等下一轮
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { return; }
    pollTick();
    // if (S.view === "scene" && S.auto && !Object.keys(S.edits).length && !S.drawer) { loadScene(true); }
  });
  // 侧栏里的会话大小、主人行踪：30 秒一次
  setInterval(function () {
    if (document.hidden) { return; }
    loadConvs();
    // if (S.view !== "scene") { loadScene(true); }
    // 停在「能力与约定」页时不自动重读，免得打断正在输入的内容（右上角有刷新）
    if (S.view !== "ledger") { loadLedger(true); }
    // // 日程：右侧面板里的修改不受重读影响；后台任务进行中由任务轮询负责刷新
    // if (!schJobTimer) { loadSchedule(true); }
    // 世界线不跟着 30 秒轮询：打开、刷新、改动后各读一次，进度条在前端自己走
  }, 30000);

  /* ================= 启动 ================= */
  function loadConvs() {
    return api("ctx/conversations").then(function (d) {
      var list = (d && d.conversations) || [];
      list.sort(function (a, b) { return (b.updated_at || 0) - (a.updated_at || 0); });
      S.convs = list;
      S.convErr = "";
      renderSide();
      if (S.view === "conv") { renderHead(); }
    }).catch(function (e) {
      S.convErr = errMsg(e);
      renderSide();
    });
  }

  function start() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function (el) {
      el.insertBefore(icon(el.getAttribute("data-icon")), el.firstChild);
    });
    var b = bridge();
    Promise.resolve(typeof b.ready === "function" ? b.ready() : null).catch(function () {}).then(function () {
      loadLedger(true);
      loadPools(true);
      // loadSchedule(true);
      // loadWorld(true);
      // return Promise.all([loadScene(true), loadConvs()]);
      // 角色名（侧栏会话名、头像颜色）改从世界线拿，以前是共享场景顺带给的
      return Promise.all([loadWorld(true), loadConvs()]);
    }).then(function () {
      showView();
      if (!S.convs.length) { renderStream(); return; }
      var saved = store.get("cid", "");
      var has = S.convs.some(function (c) { return c.cid === saved; });
      selectConv(has ? saved : S.convs[0].cid);
    }).catch(function (e) {
      toast("初始化失败：" + errMsg(e), { err: true });
    });
  }

  // 桥接脚本由面板注入，可能晚于本脚本执行：轮询等待，最多约 6 秒。
  function waitBridge(tries) {
    if (window.AstrBotPluginPage) { start(); return; }
    if (tries >= 120) {
      var box = clear($("stream"));
      box.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "页面桥接未就绪" }), h("div", { text: "请刷新一次页面；若仍如此，说明面板版本不支持插件页面。" })));
      return;
    }
    setTimeout(function () { waitBridge(tries + 1); }, 50);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { waitBridge(0); });
  } else {
    waitBridge(0);
  }
})();
