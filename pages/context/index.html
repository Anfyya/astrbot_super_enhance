      g.appendChild(h("span", null, h("b", { text: fmtK(est) }), " / " + fmtK(max)));
      g.title = "历史估算 " + fmtN(est) + " tokens\n上限 " + fmtN(max) + "，到 " + fmtN(Math.round(max * COMPRESS_AT)) + "（竖线）会触发压缩\n上次请求实际 " + fmtN(r.token_usage) + " tokens";
    } else {

  }

  /* ================= 历史：加载 ================= */
  // mode：fresh 首次加载 / older 加载更早 / keep 改完后重读 / poll 自动刷新发现有新内容
  function loadHistory(mode, added, preloaded) {
    var cid = S.cid;
    if (!cid) { return Promise.resolve(); }
    var params = { cid: cid, limit: PAGE };
    if (mode === "older" && S.range) { params.end = S.range.start; }
    if ((mode === "keep" || mode === "poll") && S.items.length) { params.limit = Math.min(2000, Math.max(PAGE, S.items.length + Math.max(0, added || 0))); }
    if (mode === "fresh") { S.histLoading = true; S.histErr = ""; hideNewPill(); renderStream(); }
    var sc = $("histScroll");
    var oldH = sc.scrollHeight, oldTop = sc.scrollTop, wasBottom = nearBottom();
    var pending = preloaded ? Promise.resolve(preloaded) : api("ctx/history", params);
    return pending.then(function (d) {
      if (cid !== S.cid) { return; }
      S.histLoading = false;
      var items = (d && d.items) || [];
      if (mode === "older") {
        var tail = S.items.filter(function (it) { return it.i >= d.end; });
        S.items = items.concat(tail);
        S.range = Object.assign({}, d, { end: S.range ? S.range.end : d.end });
      } else {
        S.items = items;
        S.range = d;
      }
      S.lastSig = d.last_sig || "";
      S.total = d.total;
      var c = curConv();
      if (c) { c.items = d.total; c.estimate_tokens = d.estimate_tokens; c.token_usage = d.token_usage; }
      // 选中的条目在新数据里不在了就丢掉
      Object.keys(S.sel).forEach(function (k) { if (!itemByIndex(+k)) { delete S.sel[k]; } });
      if (S.insp && S.insp.kind === "msg" && !itemByIndex(S.insp.i)) { closeInsp(true); }
      if (mode === "keep" || mode === "poll") { keepScroll(renderStream); } else { renderStream(); }
      renderHead();
      renderSide();
      // 自动刷新时，正在看/打字的详情面板不重画（免得光标丢掉）
      if (S.insp && !(mode === "poll" && (S.insp.dirty || $("insp").contains(document.activeElement)))) { renderInsp(); }
      if (mode === "fresh") { sc.scrollTop = sc.scrollHeight; }
      else if (mode === "older") { sc.scrollTop = oldTop + (sc.scrollHeight - oldH); }
      else if (mode === "poll") {
        if (wasBottom) { sc.scrollTop = sc.scrollHeight; }
        else if (added > 0) { showNewPill(added); }
      }
    }).catch(function (e) {
      if (cid !== S.cid) { return; }
      S.histLoading = false;
      if (mode === "poll") { return; }
      if (mode === "fresh") { S.histErr = errMsg(e); renderStream(); }
      else { toast("加载失败：" + errMsg(e), { err: true }); renderStream(); }
    });
  }

  /* ================= 历史：渲染 ================= */
  function matchItem(it, q) {
    q = q.toLowerCase();
    var hay = [splitReminder(it.text).body, it.think, it.tool_name, it.stamp];
    (it.tool_calls || []).forEach(function (c) { hay.push(c.name, c.arguments); });
    return hay.some(function (s) { return String(s || "").toLowerCase().indexOf(q) >= 0; });
  }
  function visibleItems() {
    if (!S.q) { return S.items; }
    return S.items.filter(function (it) { return matchItem(it, S.q); });
  }

  function renderStream() {
    var box = clear($("stream"));

        h("span", { class: "hint", text: "已加载 " + fmtN(S.items.length) + " / " + fmtN(r.total) + " 条" })));

  var PIC_CACHE = {};
  function loadPic(img) {
    var id = img.getAttribute("data-pic-id") || "";
    if (!id) { return; }
    var src = PIC_CACHE[id];
    if (src) { img.src = src; img.removeAttribute("data-pic-id"); return; }
    api("ctx/pic", { id: id }).then(function (d) {
      var url = d && d.url;
      if (!url) { return; }
      PIC_CACHE[id] = url;
      img.src = url;
      img.removeAttribute("data-pic-id");
    }).catch(function () {});
  }
  var picObserver = typeof IntersectionObserver === "function" ? new IntersectionObserver(function (rows) {
    rows.forEach(function (row) {

      picObserver.unobserve(row.target);
      loadPic(row.target);
    });
  }, { rootMargin: "300px" }) : null;
  function paintPic(img, ref) {
    if (typeof ref === "string") { img.src = ref; return; }
    var id = ref && ref.id;
    if (!id) { return; }
    if (PIC_CACHE[id]) { img.src = PIC_CACHE[id]; return; }
    img.setAttribute("data-pic-id", id);
    if (picObserver) { picObserver.observe(img); } else { loadPic(img); }
  }

  // 这条带的图：消息里存着的（主人发的、网页上放的）、她画的（画好那条回包下面，存着的小图）；点一下放大 / 缩回
  function picsEl(it) {

    gone.forEach(function (d) { w.appendChild(h("span", { class: "tag", text: d.id + " 已删掉" })); });
    return w;
  }

  function callEl(c, q) {

  function wireRow(row, it, opt) {

  /* ================= 历史：选择 ================= */

  function panelHead(avatarEl, title, sub, onClose) {

  // 选的、粘贴的图读成 data URI：最长边超过 1280 或者太大，先在浏览器里缩成 JPEG（后台存之前还会再看一遍）

  // 把一个基本字段的原始字符串转成真正的值
  function convertValue(sch, v) {
    var type = typeOf(sch);
    v = String(v);
    if (type === "boolean") { return { ok: true, value: v === "true" }; }
    if (type === "integer" || type === "number") {
      var n = Number(v);
      if (isNaN(n) || (type === "integer" && Math.floor(n) !== n)) { return { ok: false }; }
      return { ok: true, value: n };
    }
    if (type === "array") {
      var itemType = typeOf(sch.items || {});
      var arr = v.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      if (itemType === "integer" || itemType === "number") {
        arr = arr.map(Number);
        if (arr.some(isNaN)) { return { ok: false }; }
      }
      return { ok: true, value: arr };
    }
    if (type === "object") {
      try { return { ok: true, value: JSON.parse(v) }; } catch (e) { return { ok: false }; }
    }
    return { ok: true, value: v };
  }

  // 把表单值拼成参数 JSON；缺必填 / 格式不对时给出原因
  function buildArgs(st) {
    if (st.custom) {
      try { JSON.parse(st.targs || "{}"); return { ok: true, json: st.targs || "{}" }; } catch (e) { return { ok: false, err: "参数不是合法的 JSON" }; }
    }
    var def = toolDef(st.tools, st.tool);
    var s = schemaOf(def);
    if (!s.known) {
      var raw = st.params.__raw__ || "{}";
      try { JSON.parse(raw); return { ok: true, json: raw }; } catch (e) { return { ok: false, err: "参数不是合法的 JSON" }; }
    }
    var out = {}, missing = [], bad = [];
    var blank = function (v) { return v === undefined || String(v).trim() === ""; };
    Object.keys(s.props).forEach(function (key) {
      var sch = s.props[key] || {};
      var v = st.params[key];
      if (isObjList(sch)) {
        var props = sch.items.properties || {}, req = sch.items.required || [], arr = [];
        (Array.isArray(v) ? v : []).forEach(function (obj, idx) {
          var item = {}, any = false;
          Object.keys(props).forEach(function (k) {
            if (blank(obj[k])) { if (req.indexOf(k) >= 0) { missing.push(key + " 第" + (idx + 1) + "项的 " + k); } return; }
            var c = convertValue(props[k] || {}, obj[k]);
            if (c.ok) { item[k] = c.value; any = true; } else { bad.push(key + " 第" + (idx + 1) + "项的 " + k); }
          });
          if (any) { arr.push(item); }
        });
        if (arr.length) { out[key] = arr; }
        else if (s.req.indexOf(key) >= 0 && !missing.length) { missing.push(key); }
        return;
      }
      if (blank(v)) { if (s.req.indexOf(key) >= 0) { missing.push(key); } return; }
      var c = convertValue(sch, v);
      if (c.ok) { out[key] = c.value; } else { bad.push(key); }
    });
    if (missing.length) { return { ok: false, err: "还没填必填参数：" + missing.join("、") }; }
    if (bad.length) { return { ok: false, err: "格式不对：" + bad.join("、") }; }
    return { ok: true, json: JSON.stringify(out) };
  }

  function doAppend(btn) {

        payload.tool_output = st.tout;

      closeInsp(true);
      if (r && r.items && typeof r.start === "number") {
        S.items.forEach(function (row) { if (row.i >= r.start) { row.i += r.items.length; } });
        var start = (S.range && S.range.start) || 0;
        S.items = S.items.slice(0, Math.max(0, r.start - start)).concat(r.items, S.items.slice(Math.max(0, r.start - start)));
        S.total = r.total;

  /* ================= 请求快照 ================= */
  function loadRequests() {

    S.req.loading = true;
    S.req.err = "";
    renderReq();
    var keepId = S.req.list[S.req.idx] ? S.req.list[S.req.idx].id : "";
    api("ctx/requests", { umo: c.umo, limit: 30 }).then(function (d) {

      S.requestVersion = d && d.version || 0;
      S.req.list = (d && d.items) || [];
      S.req.disabled = !!(d && d.disabled);
      var idx = 0;

      S.req.idx = idx;
      renderReqBar();
      if (S.req.list.length) { loadSnap(); }
      else { S.req.loading = false; S.req.data = null; renderReq(); }
    }).catch(function (e) {

    }).catch(function (e) {

  // 注入块的名字：取开头有辨识度的标记，如【动态生活状态】、<RAG-Faiss-Memory>
  function blockName(text) {
    var s = String(text || "").trim();
    if (/^<system[-_\s]*reminder>/i.test(s)) { return "系统提醒（用户信息与时间）"; }
    var m = /^(【[^】]{1,20}】|<[A-Za-z][\w-]{1,40}>)/.exec(s);
    if (m) { return m[1]; }
    return s.split("\n")[0].slice(0, 30) || "文本";

  // 阅读模式：去掉行首缩进；「#」开头的行当小标题；连续空行压成一行；**粗体** 显示成粗体
  function docEl(text, raw) {
    var d = h("div", { class: "doc" + (raw ? " raw" : "") });
    if (raw) { d.textContent = text; return d; }
    var segs = [];
    String(text || "").split("\n").forEach(function (ln) {
      var t = ln.replace(/^[ \t]+/, "");
      var m = /^#{1,6}\s+(.*)$/.exec(t);
      if (m) { segs.push({ hd: m[1] }); return; }
      var last = segs[segs.length - 1];
      if (!last || last.hd !== undefined) { last = { lines: [] }; segs.push(last); }
      last.lines.push(t);
    });
    segs.forEach(function (s) {
      if (s.hd !== undefined) { d.appendChild(inlineMd(h("div", { class: "hd" }), s.hd)); return; }
      var out = [], blank = false;
      s.lines.forEach(function (l) {
        if (!l.trim()) { if (out.length && !blank) { out.push(""); } blank = true; }
        else { out.push(l); blank = false; }
      });
      while (out.length && !out[out.length - 1].trim()) { out.pop(); }
      if (out.length) { d.appendChild(inlineMd(h("div", { class: "para" }), out.join("\n"))); }
    });
    return d;
  }
  function inlineMd(el, text) {
    String(text).split(/\*\*([^*\n]+)\*\*/).forEach(function (p, k) {
      if (p) { el.appendChild(k % 2 ? h("b", { text: p }) : document.createTextNode(p)); }
    });
    return el;
  }

  /* ---------- 段里标的吃的和东西（补写写的 things；做完、没停在半路才算进清单） ---------- */

  function worldThingIsObj(t) { return t.cat === "item" || /^p\d/i.test(String(t["new"] || t.id || "")); }

  /* ---------- 这个人的时间线 ---------- */
  function worldTimelineSection(d, who) {

      : "对话 = 记录员从聊天里记的，补写 = 没人聊天时补的，手动 = 在这里写的；同一时间撞上时 手动 > 对话 > 补写";
    var sec = h("div", { class: "lsec" }, lsecHead(day.date === d.today ? "今天发生的事" : String(day.date).slice(5) + " 发生的事", sub));

      // 顺带的事挂在它发生时正在做的那段下面（那段开始以后、结束以前），不另算一站：「现在」不落在它上面，

      list = list.slice().sort(function (a, b) { return String(a.start || "").localeCompare(String(b.start || "")); });
      var now = worldNowMs(), today = day.date === d.today, nowAt = -1, parent = -1, owner = [];
      list.forEach(function (e, i) {

  // "2026-10-12 19:21[:05]" → 毫秒数（按世界线的本地时间当 UTC 算，只用来相减）
  function worldMs(t) {
    var m = /(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/.exec(String(t || ""));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;
  }

  // 此刻（世界线的钟）：本机时间加上和服务器的差
  function worldNowMs() { return Date.now() + (S.worldOffset || 0); }

  // 这段事做到百分之几（带小数）；没写结束返回 null
  function worldPct(e) {
    var a = worldMs(e.start), b = worldMs(e.end);
    if (a === null || b === null || b <= a) { return null; }
    return Math.max(0, Math.min(100, (worldNowMs() - a) / (b - a) * 100));
  }

  // 分步：进行中的标出正在做的那步（和注入给她的同一个算法：有分钟按分钟比例，没有按步数平分）
  function worldStepMins(e) {
    var steps = e.steps || [], m = e.step_minutes || [];
    return m.length === steps.length && m.length && m.every(function (x) { return +x > 0; }) ? m.map(Number) : null;
  }
  function worldStepIndex(n, pct, mins) {
    if (!mins) { return Math.min(n - 1, Math.floor(pct * n / 100)); }
    var left = pct / 100 * mins.reduce(function (a, b) { return a + b; }, 0);
    for (var i = 0; i < mins.length; i++) { left -= mins[i]; if (left < 0) { return i; } }
    return n - 1;
  }
  // 正在做的那段此刻做到哪：整段几成、正在做哪一步、这一步做到几成（分步的起止按分钟比例摊在整段上，没分钟按步数平分，
  // 和 worldStepIndex 同一个算法）；顺带把分步标上做完 / 正在做，把「还剩几分钟」写进「进行中」那个标签。没写结束的 pct 是 null
  function worldGoing(row, now) {
    var a = +row.getAttribute("data-a"), b = +row.getAttribute("data-b");
    var out = { pct: null, li: null, frac: 1 };
    if (!(a > 0 && b > a)) { return out; }
    out.pct = Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
    out.frac = out.pct / 100;
    var list = row.querySelector(".wsteps");
    if (list && list.children.length) {
      var n = list.children.length, dm = list.getAttribute("data-m"), mins = dm ? dm.split(",").map(Number) : null;
      var at = worldStepIndex(n, out.pct, mins);
      Array.prototype.forEach.call(list.children, function (li, i) { li.className = i < at ? "done" : i === at ? "now" : ""; });
      var total = mins ? mins.reduce(function (x, y) { return x + y; }, 0) : n;
      var done = mins ? mins.slice(0, at).reduce(function (x, y) { return x + y; }, 0) : at;
      var s0 = a + (b - a) * done / total, s1 = a + (b - a) * (done + (mins ? mins[at] : 1)) / total;

    }

    if (tag) {

  // 「现在」那个点放到这一段的哪儿：正在做的跟着正在做的那一步（这一步做到几成，就从它第一行往最后一行走几成）；
  // 没分步就按整段的几成走过「在做什么」那几行；没写结束、或者这段已经做完了（这会儿没在做什么），停在这一段最后
  function worldNowPlace(row, now) {

    if (!node) { return; }

  // 每秒走一次：正在做的那几段标分步、写还剩多少；「现在」的点挪到位；一天条带上的那根线也挪。返回正在做的有没有到点

  // 今天：把「现在」那个点挪到视口偏上的地方（打开世界线、换人、换日期时）；没有这个点（不是今天）回到最上面

  // where：now = 「现在」落在这一段里（今天最后一段已经开始的），future = 还没开始，
  //        tail = 挂在「现在」那段下面、已经发生的顺带事（线照那段剩下的画虚线），空 = 已经开始过了
  // next：「现在」落在这一段、这段又已经做完了的时候，下一段（写一句这会儿空着）
  function worldEntryRow(d, e, date, where, next) {

      (where === "now" ? " wnowin" : where === "tail" ? " wtail" : ""),

  // 分步：一行一步，做什么和几分钟分开填；回车加下一步，空的那步按退格删掉。上面一行现算一共几分钟、和这段对不对得上
  function worldStepsEditor(f, spanMin) {
    if (!Array.isArray(f.steps)) { f.steps = []; }
    var note = h("span", { class: "ed-n" });
    var fix = h("button", { class: "fix", type: "button", hidden: true });
    var list = h("div", { class: "ed-steps" });
    var sec = edSec([h("div", { class: "ed-cap" },
      h("span", { class: "l", title: "按进度只给她看到正在做的那一步，后面的不给；没有分步就把整段给她", text: "分步" }), note, fix), list]);
    function refresh() {
      var rows = f.steps.filter(function (x) { return String(x.text || "").trim(); });
      var mins = rows.map(function (x) { return +x.minutes || 0; });
      var have = mins.filter(function (m) { return m > 0; }).length;
      var span = spanMin();
      fix.hidden = true;
      note.className = "ed-n";
      if (!rows.length) { note.textContent = "没有分步，就把整段给她看"; return; }
      if (!have) { note.textContent = rows.length + " 步 · 没填分钟，按步数平分"; return; }
      if (have < rows.length) { note.textContent = "有 " + (rows.length - have) + " 步没填分钟：要么都填，要么都不填"; note.classList.add("warn"); return; }
      var total = mins.reduce(function (a, b) { return a + b; }, 0);
      if (!span || span === total) {
        note.textContent = rows.length + " 步 · 共 " + total + " 分钟" + (span ? "，和这段一样长" : "");
        if (span) { note.classList.add("ok"); }
        return;
      }
      note.textContent = rows.length + " 步 · 共 " + total + " 分钟，这段 " + span + " 分钟（按比例摊开）";
      var last = rows[rows.length - 1], rest = span - (total - (+last.minutes || 0));
      if (rest > 0) {
        fix.hidden = false;
        fix.textContent = "最后一步改成 " + rest + " 分钟";
        fix.onclick = function () { last.minutes = String(rest); draw(-1); };

    }
    function draw(focusAt, toEnd) {
      list.textContent = "";

        t.value = st.text || "";
        t.addEventListener("input", function () { st.text = t.value; worldFit(t); refresh(); });
        t.addEventListener("keydown", function (ev) {
          if (ev.isComposing || ev.keyCode === 229 || ev.metaKey || ev.ctrlKey || ev.altKey) { return; }

        m.value = st.minutes || "";
        m.addEventListener("input", function () {
          var v = m.value.replace(/[^\d]/g, "").slice(0, 4);
          if (m.value !== v) { m.value = v; }
          st.minutes = v;
          refresh();
        });
        var del = h("button", { class: "ed-x", type: "button", title: "删掉这一步", "aria-label": "删掉第 " + (i + 1) + " 步" }, icon("x"));
        del.addEventListener("click", function () { f.steps.splice(i, 1); draw(Math.min(i, f.steps.length - 1)); });
        list.appendChild(h("div", { class: "ed-step" }, h("span", { class: "no", text: String(i + 1) }), t,
          h("span", { class: "ed-mins" }, m, h("span", { text: "分" })), del));
      });
      list.appendChild(h("button", { class: "ed-addrow", type: "button", onclick: function () { f.steps.push({ text: "", minutes: "" }); draw(f.steps.length - 1); } },
        icon("plus"), f.steps.length ? "加一步" : "加分步"));
      edFitIn(list);
      if (focusAt >= 0) {

  /* ---------- 世界线一段动了家里哪些吃的：用掉 / 吃了家里有的，做好 / 买回来新的 ---------- */
  // 一行一样：收着是一句话（这一步、编号、名字、多少），点开就地改，同一时间只开一行；新加的那行直接开着。
  // 新的先用临时代号（n1、n2……），存的时候程序发编号；这一段里别的步、用料能指着它。东西（p 开头）只能删
  var WT_NEW = ["买回来", "收到", "做好了"];
  var WT_PROC = ["腌上了", "晒上了", "熏上了"];

  // 一件吃的叫什么、是不是盘菜、按不按量记：这一段新添的看那一步，家里有的看清单，未来里的看世界线那一步
  function wtInfo(f, id) {
    var mine = (f.things || []).filter(function (t) { return t["new"] === id; })[0];
    if (mine) { return { name: mine.name || "", dish: mine.what === "做好了", measured: thingMeasuredKind(mine.kind) }; }
    var it = thingFind(id);
    if (it) { return { name: it.name, dish: ((it.stages || [])[0] || {}).what === "做好了", measured: !!it.measured }; }
    var fu = futureFind(id);
    if (fu) { return { name: fu.name, dish: fu.what === "做好了", measured: thingMeasuredKind(fu.kind) }; }
    return { name: ((S.world && S.world.thing_names) || {})[id] || "", dish: false, measured: false };
  }
  // 能挑来用掉、吃掉、当用料的：这一段新添的、家里现在有的、未来里要添的（这一段开始前就添上的才列；start 认不出就都列）
  function wtStock(f, start) {
    var out = [], seen = {};
    function add(c) { if (!seen[c.id]) { seen[c.id] = true; out.push(c); } }
    (f.things || []).forEach(function (t) {
      if (t["new"] && !worldThingIsObj(t)) {
        add({ id: t["new"], label: /^n\d+$/.test(t["new"]) ? "新" : t["new"], name: t.name || "（还没起名）", sub: "这一段" + (t.what === "做好了" ? "做好的" : t.what + "的") });
      }
    });
    ((S.things && S.things.items) || []).forEach(function (x) {
      if (!x.ended) { add({ id: x.id, name: x.name, sub: [x.kind, String(x.left || "").replace(/，快用完了$/, "")].filter(Boolean).join(" · ") }); }
    });
    ((S.things && S.things.future) || []).forEach(function (x) {
      var at = String((x.made || {}).end || (x.made || {}).start || "").slice(0, 16);
      if (x.cat === "food" && (!start || !at || at <= start)) { add({ id: x.id, name: x.name, sub: "未来 · " + futureVerb(x) + " " + futureWhen(x) }); }
    });
    return out;
  }
  // 收着时那一句后面的：多少、用料几样、挪到哪
  function wtSum(t) {
    var bits = [];
    if (t["new"]) {
      if (t.kind) { bits.push(t.kind); }
      if (t.amount || t.left) { bits.push(t.amount || t.left); }
      if ((t.from || []).length) { bits.push("用料 " + t.from.length + " 样"); }
    } else {
      var end = S.things && S.things.steps.end.indexOf(t.what) >= 0;
      if (t.used) { bits.push("用了 " + t.used); }
      if (t.amount) { bits.push("清点出 " + t.amount); }
      if (t.left && !end) { bits.push((/^还?剩/.test(t.left) ? "" : "剩") + t.left); }
      if (t.place) { bits.push((t.what === "挪地方" ? "挪到 " : "在 ") + t.place); }
      if (thingSpotShown(t.spot)) { bits.push(t.spot); }
    }
    return bits.join(" · ");
  }

  function worldThingsEditor(d, f) {
    if (!Array.isArray(f.things)) { f.things = []; }

      h("span", { class: "ed-n", text: "这段做完才算进家里" })), list, adds, objWrap]);

        h("span", { class: "chev", "aria-hidden": "true" }, icon("chev")), del);
      function toggle() {
        if (!ready) { toast("家里的吃的还没读到，刷新一下再改", { err: true }); return; }
        ui.wt = open ? -1 : f.things.indexOf(t);

      }
      row.addEventListener("click", toggle);

    function focusMark(el) { el.setAttribute("data-wt-focus", "1"); return el; }

    function useBody(t, head) {
      var info = wtInfo(f, t.id);
      var p = edProps();

      edRow(p, "这一步", edChips(steps, t.what, function (v) {

      }));
      var set = function (k) { return function (v) { t[k] = v; head(); }; };
      if (t.what === "用掉一部分" || t.what === "吃了一部分") {
        if (info.measured) { edRow(p, "用了多少", focusMark(edInput(t.used, "例如 3 克、15 毫升；空着按平常一次的量扣", set("used")))); }

    function newBody(t, head) {

  // 改 / 手动加一段：上面和显示时一样排（起止、地点、在做什么，字大一号），中间分步，下面一张属性表

    }).catch(function (e) {
      toast("初始化失败：" + errMsg(e), { err: true });
    });
  }

  // 桥接脚本由面板注入，可能晚于本脚本执行：轮询等待，最多约 6 秒。
  function waitBridge(tries) {
    if (window.AstrBotPluginPage) { start(); return; }
    if (tries >= 120) {
      var box = clear($("stream"));
      box.appendChild(h("div", { class: "empty-state" }, h("div", { class: "big", text: "页面桥接未就绪" }), h("div", { text: "请刷新一次页面；若仍如此，说明面板版本不支持插件页面。" })));
      return;
    }
    setTimeout(function () { waitBridge(tries + 1); }, 50);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { waitBridge(0); });
  } else {
    waitBridge(0);
  }
})();
</script>
</body>
</html>
